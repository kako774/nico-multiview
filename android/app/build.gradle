plugins {
    id 'com.android.application'
}

android {
    namespace 'stream.nicoran.multiview'
    compileSdk 34
    defaultConfig {
        applicationId 'stream.nicoran.multiview'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
