<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ログ</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{--bg:#f6f7f9;--fg:#1b2230;--sub:#5a6578;--line:#dfe3ea;--btn:#e9edf3;--err:#c5221f;--warn:#a15c00}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#e7eaf0;--sub:#9aa5b8;--line:#2a303c;--btn:#262c38;--err:#ff8a80;--warn:#ffb74d}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:13px/1.6 "Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif}
.bar{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.bar .g{flex:1;color:var(--sub);font-size:12px}
button{font:inherit;font-size:12px;padding:3px 12px;border:1px solid var(--line);border-radius:6px;background:var(--btn);color:var(--fg);cursor:pointer}
#list{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 0;font-family:"Cascadia Mono",Consolas,"Noto Sans JP",monospace;font-size:12px}
.l{display:grid;grid-template-columns:5.6em 4.2em 1fr;gap:8px;padding:2px 12px;border-bottom:1px solid var(--line)}
.l .t{color:var(--sub);font-variant-numeric:tabular-nums}
.l .m{min-width:0;word-break:break-all;user-select:text}
.l .lv{font-weight:700;font-size:11px;letter-spacing:.03em;color:var(--sub)}
.l.w .lv,.l.w .m{color:var(--warn)}
.l.e .lv,.l.e .m{color:var(--err)}
#empty{color:var(--sub);text-align:center;padding:32px 12px}
</style></head><body>
<div class="bar"><span class="g">アプリの動きの記録です(URLは記録しません。アプリを閉じると消えます)</span><button id="cp">コピー</button><button id="cl">消去</button></div>
<div id="list"><div id="empty">まだ記録がありません</div></div>
<script>
(() => {
  const $ = s => document.querySelector(s), list = $('#list'), all = [];
  const two = n => String(n).padStart(2, '0');
  const clock = t => { const d = new Date(t); return two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()); };
  const atBottom = () => list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  function add(l) {
    const stick = atBottom(); const e = $('#empty'); if (e) e.remove();
    all.push(l);
    const lvl = l.l || 'INFO';
    const r = document.createElement('div'); r.className = 'l' + (lvl === 'ERROR' ? ' e' : lvl === 'WARN' ? ' w' : '');
    const t = document.createElement('span'); t.className = 't'; t.textContent = clock(l.t);
    const lv = document.createElement('span'); lv.className = 'lv'; lv.textContent = lvl;
    const m = document.createElement('span'); m.className = 'm'; m.textContent = l.m;
    r.append(t, lv, m); list.appendChild(r);
    if (stick) list.scrollTop = list.scrollHeight;
  }
  window.lg.onLine(add);
  window.lg.init().then(rows => { (rows || []).forEach(add); list.scrollTop = list.scrollHeight; });
  $('#cp').addEventListener('click', () => { window.lg.copy(all.map(l => clock(l.t) + '  ' + (l.l || 'INFO').padEnd(5) + '  ' + l.m).join('\n')); $('#cp').textContent = 'コピーしました'; setTimeout(() => { $('#cp').textContent = 'コピー'; }, 1500); });
  $('#cl').addEventListener('click', () => { window.lg.clear(); all.length = 0; list.innerHTML = '<div id="empty">まだ記録がありません</div>'; });
})();
</script></body></html>
