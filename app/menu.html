<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>menu</title>
<style>
:root{
  --bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--text:#e8eaf0;--sub:#9aa3b2;--accent:#4da3ff;--danger:#ff6b6b;--ok:#5fd38d;
  --input:#0c0e12;--btn:#232834;--btnhv:#44507a;--onaccent:#06121f;--tilebg:#05070a;--stagebg:#000;--tagbg:#000a;
  --hl:#1d3a5c;--dragbg:#0b0e14;--dragon:#14263d;--chip:#161a22;--hover:#ffffff0a;--rowline:#ffffff08;
  --c0:#4da3ff;--c1:#ff8a5c;--c2:#5fd38d;--c3:#e0b341;--c4:#c78bff;--c5:#ff6fa8;--c6:#4fd1d9;--c7:#a3b86c;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6fa;--panel:#ffffff;--line:#d3d9e3;--text:#1a1f2b;--sub:#5b6577;--accent:#1a73e8;--danger:#d93025;--ok:#188038;
    --input:#ffffff;--btn:#eef1f6;--btnhv:#9db4dc;--onaccent:#ffffff;--tilebg:#dfe4ec;--stagebg:#e6eaf1;--tagbg:#ffffffd9;
    --hl:#cfe0fb;--dragbg:#e3e8f0;--dragon:#cfe0fb;--chip:#f0f3f8;--hover:#0000000a;--rowline:#00000010;
    --c0:#1a73e8;--c1:#d9531e;--c2:#188038;--c3:#9a6b00;--c4:#8a3ffc;--c5:#c2185b;--c6:#00838f;--c7:#5d6f1f;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--panel);color:var(--text);font-family:"Noto Sans JP","Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;font-size:14px;overflow:hidden}
body{border:1px solid var(--line);border-radius:8px}
body.volbody #root{padding:6px 10px}
:root[data-theme="glassb"] body.volbody{background:#20222e}
:root[data-theme="glassc"] body.volbody{background:#fbfbfd}
:root[data-theme="glassf"] body.volbody{background:#15151b}
.volrow{display:flex;align-items:center;gap:8px}
.volrow input{flex:1;min-width:0;accent-color:var(--accent);cursor:pointer}
.volnum{font-size:12px;color:var(--sub);min-width:3em;text-align:right;font-variant-numeric:tabular-nums}
#root{padding:12px;max-height:100vh;overflow:auto}
h2{margin:0 0 8px;font-size:15px}
.hint{font-size:12px;color:var(--sub)}
input[type=text]{min-width:0;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--text);font:inherit}
input[type=text]:focus{outline:2px solid var(--accent)}
button,select{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--btnhv)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row input[type=text]{flex:1;min-width:160px}
.sgmsg{padding:14px;color:var(--sub);text-align:center;font-size:13px}
.evi{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.evi:hover,.evi.on{background:var(--hl)}
.evi .k{font-size:11px;color:var(--sub);font-weight:400}
.evi .t{flex:1;min-width:0;font-weight:700;font-size:13px}
.sg{display:flex;gap:10px;align-items:center;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.sg:last-child{border-bottom:0}
.sg.on{background:var(--hl)}
.sg img{width:80px;height:45px;object-fit:cover;border-radius:4px;background:var(--tilebg);flex:0 0 auto}
.sg .tx{min-width:0;flex:1}
.sg .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .tt{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .mt{font-size:11px;color:var(--sub)}
.sg .ad{font-size:12px;color:var(--ok);flex:0 0 auto;display:none}
.sg.added .ad{display:block}
body.sugmode #root{padding:0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.srow+.srow{border-top:1px solid var(--line)}
.srow.upd{flex-wrap:wrap;color:var(--accent);font-size:13px}
.hint{padding:0 0 6px;margin-top:-2px}
.lnk{background:none;border:0;padding:0;font:inherit;font-size:12px;color:var(--accent);text-decoration:underline;cursor:pointer;text-align:left}
.srow .ok{color:var(--ok);font-size:12px}
.ver{text-align:right;font-size:12px;color:var(--sub);padding-top:6px;border-top:1px solid var(--line)}

/* ガラステーマ: メニューも、ガラス風のパネルにする(後ろは映像のビューなので、見やすさのため透け具合は控えめ) */
:root[data-theme="glassb"]{--panel:rgba(30,30,34,.97);--line:rgba(255,255,255,.14);--text:#f3f4f8;--sub:#a9abb5;--accent:#7fb2ff;--input:rgba(0,0,0,.32);--btn:rgba(255,255,255,.08);--btnhv:rgba(255,255,255,.35);--onaccent:#08142b;--hl:rgba(255,255,255,.12);--chip:rgba(255,255,255,.08);color-scheme:dark}
:root[data-theme="glassc"]{--panel:rgba(251,251,253,.97);--line:rgba(0,0,0,.12);--text:#1c1f26;--sub:#5d6475;--accent:#0a84ff;--input:rgba(255,255,255,.85);--btn:rgba(255,255,255,.85);--btnhv:#0a84ff;--onaccent:#fff;--hl:rgba(10,132,255,.18);--chip:rgba(0,0,0,.05);color-scheme:light}
:root[data-theme="glassf"]{--panel:rgba(16,16,19,.97);--line:rgba(255,255,255,.11);--text:#ececf2;--sub:#9a9cab;--accent:#8ab4ff;--input:rgba(255,255,255,.08);--btn:rgba(255,255,255,.07);--btnhv:rgba(255,255,255,.3);--onaccent:#071228;--hl:rgba(255,255,255,.1);--chip:rgba(255,255,255,.07);color-scheme:dark}
:root[data-theme^="glass"] body{border-color:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
:root[data-theme="glassc"] body{border-color:rgba(0,0,0,.12);box-shadow:none}
:root[data-theme^="glass"] button,:root[data-theme^="glass"] select{border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
:root[data-theme="glassc"] button,:root[data-theme="glassc"] select{box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* メニューの項目(文字だけのボタン)は、線や影を付けず、乗せたときだけ色を付ける */
.lnk{box-shadow:none!important;border-radius:6px}
button.lnk[style*="display:block"]:hover{background:var(--hl)}

/* 選択肢の一覧は、背景が透けないよう、はっきりした色にする */
:root[data-theme="glassb"] option{background:#26262b;color:#f3f4f8}
:root[data-theme="glassf"] option{background:#14141b;color:#ececf2}
:root[data-theme="glassc"] option{background:#ffffff;color:#1c1f26}

/* 設定: 名前の下の説明、メニューの「すべての設定…」、設定ウィンドウのタブ */
.srow .sl{min-width:0;flex:1}
.srow .grow{flex:1}
.sdesc{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.5}
.srow.allset{cursor:pointer;color:var(--accent)}
.srow.allset:hover{background:var(--hl);border-radius:6px}
.srow .sub{color:var(--sub)}
body.setwin{border:0;border-radius:0;box-shadow:none!important;background-image:none!important;height:100vh}
body.setwin #root{padding:0;height:100vh;max-height:none;display:flex;flex-direction:column}
.stabs{display:flex;gap:2px;padding:6px 14px 0;border-bottom:1px solid var(--line);flex:none}
.stabs .stab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0!important;box-shadow:none!important;padding:8px 12px;color:var(--sub)}
.stabs .stab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.sbody{padding:6px 18px 16px;overflow:auto;flex:1}
.sbody .srow{padding:10px 0}
.sfoot{padding:10px 0 0;line-height:1.6}
.evbtns{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.evbtns button{font-size:12px;padding:4px 10px}
.evex{font-size:12px;font-weight:400;color:var(--sub);display:flex;align-items:center;gap:4px}
</style></head><body><div id="root"></div>
<script>
(() => {
  'use strict';
  const root = document.getElementById('root');
  let type = '', data = {}, seq = 0;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const btn = (label, fn, title) => { const b = el('button', '', label); b.type = 'button'; if (title) b.title = title; b.addEventListener('click', fn); return b; };
  const fmtEnd = sec => { const d = new Date(sec * 1000); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const keyOf = t => { const m = String(t || '').match(/auditions\/([\w-]{1,80})/) || String(t || '').trim().match(/^([\w-]{1,80})$/); return m ? m[1] : ''; };
  const report = () => requestAnimationFrame(() => window.menu.size(root.scrollHeight + 2));
  const textInput = ph => { const i = el('input'); i.type = 'text'; i.placeholder = ph; i.autocomplete = 'off'; return i; };

  /* ---- 枠の保存 ---- */
  let ppDraft = '';
  function renderPP() {
    root.textContent = '';
    root.appendChild(el('h2', '', '📁 枠の保存'));
    const row = el('div', 'row'), name = textInput('保存名'); name.value = ppDraft; name.addEventListener('input', () => { ppDraft = name.value; });
    const save = () => { window.menu.act('pp-save', name.value, true); ppDraft = ''; };
    name.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) save(); });
    row.append(name, btn('いまの枠を保存', save), btn('閉じる', () => window.menu.close()));
    root.appendChild(row);
    const L = el('div');
    if (!data.presets || !data.presets.length) L.appendChild(el('div', 'sgmsg', '保存した枠はまだありません'));
    (data.presets || []).forEach((p, i) => {
      const d = el('div', 'evi'), t = el('div', 't', p.name);
      t.appendChild(el('div', 'k', `${p.items.length}枠: ` + p.items.map(id => (data.names && data.names[id]) || id).join('、')));
      d.append(t, btn('開く', e => { e.stopPropagation(); window.menu.act('pp-open', i); }), btn('削除', e => { e.stopPropagation(); window.menu.act('pp-del', i, true); }));
      L.appendChild(d);
    });
    root.appendChild(L); report();
  }

  /* ---- ギフトイベント ---- */
  let evN = 4, evKeyDraft = '', evExTop = new Map();  // 紅組・白組それぞれのチェック状態
  const exOn = e => evExTop.has(e.key) ? evExTop.get(e.key) : true;
  async function renderEV() {
    const my = ++seq;
    evN = data.evN || evN;
    root.textContent = '';
    root.appendChild(el('h2', '', '🎁 ギフトイベントの上位者を自動表示'));
    root.appendChild(el('div', 'hint', '開催中のイベントを選ぶと、上位者のうち「いま放送中」の人の枠を順位順に並べ、順位が変わると枠も自動で入れ替わります(1分ごとに更新)。'));
    const row = el('div', 'row'), sel = el('select');
    for (let i = 1; i <= 12; i++) sel.add(new Option(String(i), String(i)));
    sel.value = String(evN); sel.addEventListener('change', () => { evN = Number(sel.value) || 4; });
    const lab = el('label'); lab.append('表示する順位 上位 ', sel, ' 位まで');
    row.append(lab, btn('一覧を更新', renderEV), btn('閉じる', () => window.menu.close()));
    root.appendChild(row);
    const L = el('div'); L.appendChild(el('div', 'sgmsg', '開催中のイベントを探しています…')); root.appendChild(L); report();
    let r; try { r = await window.menu.evList(data.evKeys || []); } catch { r = null; }
    if (my !== seq) return;
    L.textContent = '';
    if (!r || !r.ok || !r.events.length) { L.appendChild(el('div', 'sgmsg', 'イベントが見つかりませんでした。')); report(); return; }
    // 紅白歌枠合戦は、いちばん上に、紅組→白組の順で出す(ほかのイベントは、届いた順のまま)
    const khk = e => { const m = /^\d+-kohaku-(aka|shiro)$/.exec(e.key || ''); return m ? (m[1] === 'aka' ? 0 : 1) : 2; };
    r.events = r.events.map((e, i) => ({ e, i })).sort((a, b) => khk(a.e) - khk(b.e) || a.i - b.i).map(x => x.e);
    r.events.forEach(e => {
      const d = el('div', 'evi' + (data.evTrack && data.evTrack.key === e.key ? ' on' : '')), t = el('div', 't', e.title);
      t.appendChild(el('div', 'k', (e.kind === 'gift' ? '🎁 ギフト' : e.kind === 'ad' ? '📣 ニコニ広告' : '🏆 イベント') + ` / 〜${fmtEnd(e.end)}` + (e.entries ? ` / 参加${e.entries}人` : '')));
      if (/^\d+-kohaku-(aka|shiro)$/.test(e.key)) {
        // 紅白: 公式の順位(年間ランキング)か、イベントランキング(ニコ生ランキングのイベントのページの計算)かを選ぶ
        t.appendChild(el('div', 'k', '年間=公式順位 / イベント=期間中の点'));
        const bs = el('div', 'evbtns');
        bs.append(btn('年間で追跡', ev => { ev.stopPropagation(); window.menu.act('ev-track', { event: e, n: evN, mode: '' }); }, '公式の順位(年間ランキング)で並べます。10位除外のチェックは関係ありません'),
          btn('イベントで追跡', ev => { ev.stopPropagation(); window.menu.act('ev-track', { event: e, n: evN, mode: exOn(e) ? 'event' : 'event-all' }); }, 'ニコ生ランキングのイベントのページと同じ「イベントランキング」で並べます(更新は1分ごと)'));
        const ex = el('label', 'evex'); const xc = el('input'); xc.type = 'checkbox'; xc.checked = exOn(e); xc.addEventListener('click', ev => ev.stopPropagation()); xc.addEventListener('change', () => { evExTop.set(e.key, xc.checked); });
        ex.addEventListener('click', ev => ev.stopPropagation()); ex.append(xc, ' 年間上位10位を除く(イベントのみ)'); bs.appendChild(ex);
        d.append(t, bs); d.style.cursor = 'default';
      } else {
        d.append(t, btn('追跡開始', () => {}));
        d.addEventListener('click', () => window.menu.act('ev-track', { event: e, n: evN }));
      }
      L.appendChild(d);
    });
    report();
  }

  /* ---- フォロー中の放送 ---- */
  let flList = null, flErr = '', flBuilt = false, flL = null, flMsg = null, flRef = null, flRows = new Map();
  // 画面を作り直さず、変わったところだけ更新する(押したボタンやサムネイルが一瞬消えて、点滅するのを防ぐ)
  async function renderFL(refetch, force) {
    const my = ++seq;
    if (!flBuilt) {
      root.textContent = ''; flRows = new Map();
      root.appendChild(el('h2', '', '👥 フォロー中の放送'));
      const row = el('div', 'row');
      flRef = btn('一覧を更新', () => renderFL(true, true));
      row.append(flRef, btn('すべて追加', () => { const ids = (flList || []).map(x => x.id).filter(id => !(data.items || []).includes(id)); if (ids.length) window.menu.act('fl-all', ids, true); }), btn('閉じる', () => window.menu.close()));
      root.appendChild(row);
      flMsg = el('div', 'sgmsg'); flMsg.style.display = 'none'; root.appendChild(flMsg);
      flL = el('div'); root.appendChild(flL);
      flBuilt = true;
    }
    const paint = (busy) => {
      const have = data.items || [];
      let msg = '';
      if (!flList) msg = busy ? 'フォロー中の放送を探しています…' : (flErr || '取得できませんでした');
      else if (!flList.length && !busy) msg = 'いま放送中のフォロー中の番組はありません。';
      else if (busy) msg = '更新しています…';
      flMsg.textContent = msg; flMsg.style.display = msg ? '' : 'none';
      const want = flList || [], ids = new Set(want.map(x => x.id));
      for (const [id, r] of flRows) if (!ids.has(id)) { r.remove(); flRows.delete(id); }
      want.forEach((it, i) => {
        let r = flRows.get(it.id);
        if (!r) {
          r = el('div', 'sg');
          const img = el('img'); img.alt = ''; if (it.thumb) img.src = it.thumb;
          const tx = el('div', 'tx');
          tx.append(el('div', 'nm', it.name || it.title || it.id), el('div', 'tt', it.name ? it.title : ''), el('div', 'mt', it.id + (it.watch ? ` ・ 来場 ${Number(it.watch).toLocaleString('ja-JP')}` : '')));
          r.append(img, tx, el('div', 'ad', '✓ 追加済み'));
          if (it.name) { const bl = el('button', 'bell'); bl.type = 'button'; bl.style.cssText = 'flex:none;align-self:center;margin-left:6px;padding:2px 6px;font-size:16px;background:none;border:0;cursor:pointer'; bl.addEventListener('click', e => { e.stopPropagation(); window.menu.act('fw-on', it.name, true); }); r.appendChild(bl); }
          r.addEventListener('click', () => { if (!(data.items || []).includes(it.id)) window.menu.act('fl-add', it.id, true); });
          flRows.set(it.id, r);
        } else {
          const nm = r.querySelector('.nm'), mt = r.querySelector('.mt');
          const t = it.name || it.title || it.id, m = it.id + (it.watch ? ` ・ 来場 ${Number(it.watch).toLocaleString('ja-JP')}` : '');
          if (nm && nm.textContent !== t) nm.textContent = t;
          if (mt && mt.textContent !== m) mt.textContent = m;
        }
        r.classList.toggle('added', have.includes(it.id));
        const bl = r.querySelector('.bell');
        if (bl) { const on = (data.fwOn || []).includes(it.name); bl.textContent = on ? '🔔' : '🔕'; bl.title = on ? '通知・自動追加の対象です(クリックで外す)' : '通知・自動追加の対象ではありません(クリックで対象にする)'; bl.style.opacity = on ? '1' : '.45'; }
        if (flL.children[i] !== r) flL.insertBefore(r, flL.children[i] || null);
      });
      flRef.disabled = !!busy;
      report();
    };
    // 前に取れた一覧が残っていれば、先にそれを出して、裏で新しくする(開くのを待たせない)
    if (refetch || !flList) {
      paint(true);
      let r; try { r = await window.menu.followList(!!force); } catch { r = null; }
      if (my !== seq) return;
      if (!r || !r.ok) { if (!flList || force) { flList = null; flErr = (r && r.error) || '取得できませんでした'; } } else { flList = r.list; flErr = ''; }
    }
    paint(false);
  }

  /* ---- 枠のヘッダーの「⋯」(入りきらないボタンをまとめたメニュー) ---- */
  function renderHM() {
    root.textContent = '';
    root.appendChild(el('h2', '', data.fmName || data.fmId || '放送'));
    (data.hmItems || []).forEach(it => {
      const b = el('button', 'lnk', it.label); b.type = 'button';
      b.style.cssText = 'display:block;width:100%;text-align:left;padding:9px 6px;font-size:14px;text-decoration:none;color:inherit';
      b.addEventListener('click', () => window.menu.act('hm-act', { id: data.fmId, k: it.k }, false));
      root.appendChild(b);
    });
    report();
  }

  /* ---- 枠の放送者名の右クリックメニュー ---- */
  function renderFM() {
    root.textContent = '';
    root.appendChild(el('h2', '', data.fmName || data.fmId || '放送'));
    const mk = (label, act) => { const b = el('button', 'lnk', label); b.type = 'button'; b.style.cssText = 'display:block;width:100%;text-align:left;padding:9px 6px;font-size:14px;text-decoration:none;color:inherit'; b.addEventListener('click', () => window.menu.act(act, data.fmId, false)); return b; };
    root.append(mk('放送の詳細を表示', 'fm-detail'), mk('放送のURLをコピー', 'fm-url'), mk('放送者のユーザーページを開く', 'fm-user'));
    { const fb = mk(data.fmFxShown ? '🎮 この枠のゲーム・ギフト・エモーション演出を消す(一時的)' : '🎮 この枠のゲーム・ギフト・エモーション演出を出す(一時的)', 'fm-fx'); fb.title = 'この枠だけ、演出の表示を一時的に切り替えます(読み込み直しません)。全体の設定は変わりません。枠を閉じると元に戻ります'; root.appendChild(fb); }
    report();
  }

  /* ---- 追跡開始の確認 ---- */
  let dlgDraft = '';
  function renderDLG() {
    root.textContent = '';
    root.appendChild(el('h2', '', '今開いている枠を閉じて追跡を始めます'));
    const names = data.dlgNames || [];
    root.appendChild(el('div', 'hint', `いま開いている ${data.dlgCount || 0} 枠(${names.slice(0, 4).join('、')}${(data.dlgCount || 0) > 4 ? ' ほか' : ''})はすべて閉じます。保存しますか?`));
    const name = textInput('保存名(例: いつもの枠)'); name.value = dlgDraft; name.addEventListener('input', () => { dlgDraft = name.value; });
    const r1 = el('div', 'row'); r1.appendChild(name); root.appendChild(r1);
    const go = (a) => { const v = name.value; dlgDraft = ''; window.menu.act(a, v); };
    const r2 = el('div', 'row'); r2.append(btn('保存して開始', () => go('dlg-save')), btn('保存せずに開始', () => go('dlg-no')), btn('キャンセル', () => go('dlg-cancel')));
    root.appendChild(r2); report();
  }

  /* ---- 検索候補(入力欄は本体側。ここは表示と選択だけ) ---- */
  function renderSUG() {
    const keep = root.scrollTop; root.textContent = '';
    const s = data.sug || {};
    if (s.msg) { root.appendChild(el('div', 'sgmsg', s.msg)); report(); return; }
    (s.items || []).forEach((it, i) => {
      const row = el('div', 'sg' + (i === s.idx ? ' on' : '') + ((s.added || []).includes(it.id) ? ' added' : ''));
      const img = el('img'); img.alt = ''; if (it.thumb) img.src = it.thumb;
      const tx = el('div', 'tx');
      tx.append(el('div', 'nm', it.name || it.id), el('div', 'tt', it.title), el('div', 'mt', `${it.id} ・ 来場 ${Number(it.watch).toLocaleString('ja-JP')}${it.type === 'channel' ? ' ・ チャンネル' : it.type === 'official' ? ' ・ 公式' : ''}`));
      row.append(img, tx, el('div', 'ad', '✓ 追加済み'));
      row.addEventListener('mousedown', e => e.preventDefault());
      row.addEventListener('mouseenter', () => { root.querySelectorAll('.sg').forEach((r, j) => r.classList.toggle('on', j === i)); window.menu.act('sug-hover', i, true); });
      row.addEventListener('click', () => window.menu.act('sug-pick', i, true));
      root.appendChild(row);
    });
    root.scrollTop = keep;
    const on = root.querySelector('.sg.on'); if (on && s.scroll) on.scrollIntoView({ block: 'nearest' });
    report();
  }

  /* ---- 設定 ---- */
  /* ---- 設定 ----
     設定の項目は、ここで1つずつ決める(名前・説明・どのタブか・操作の部品)。
     ⚙のメニュー(よく使うもの)と、設定ウィンドウ(すべて。タブで切り替え)の両方で使う */
  const THEMES_OPT = [['system', '自動'], ['light', 'ライト'], ['dark', 'ダーク'], ['glassb', 'ガラス(ダーク)'], ['glassc', 'ガラス(明るい)'], ['glassf', 'ガラス(スモーク)']];
  const SET_TABS = [['view', '表示'], ['audio', '音声と枠'], ['viewer', 'コメビュ'], ['follow', 'フォロー'], ['other', 'その他']];
  const QUICK = ['theme', 'dockpos', 'po', 'fx', 'top'];   // ⚙のメニューに残す、よく使う項目
  let setTab = 'view';
  const mkSel = (opts, cur, act) => { const x = el('select'); opts.forEach(([v, t]) => x.add(new Option(t, v))); x.value = cur; x.addEventListener('change', () => window.menu.act(act, x.value, true)); return x; };
  const mkCb = (on, act, inv) => { const c = el('input'); c.type = 'checkbox'; c.checked = !!on; c.addEventListener('change', () => window.menu.act(act, inv ? !c.checked : c.checked, true)); return c; };
  function setItems() {
    return [
      { k: 'theme', tab: 'view', label: 'テーマ', desc: 'アプリ全体の色。ガラスは、Windows 11 では背景がすりガラスになります', ctl: () => mkSel(THEMES_OPT, data.theme || 'system', 'set-theme') },
      { k: 'po', tab: 'view', label: 'プレイヤーのみ', desc: '視聴ページの映像とコメントだけを、枠いっぱいに表示します。OFFにすると、視聴ページ全体を表示します', ctl: () => mkCb(data.playerOnly !== false, 'set-po') },
      { k: 'seek', tab: 'view', label: 'シークバーを使う', desc: '映像の下に、タイムシフトの巻き戻しのバーを出します', ctl: () => mkCb(data.seekOn !== false, 'set-seek') },
      { k: 'sm', tab: 'view', label: '召喚獣の個数を表示', desc: 'ギフトイベントの順位つきの枠で、名前の横に召喚獣の数(召・改・神)を出します', ctl: () => mkCb(data.showSm !== false, 'set-sm') },
      { k: 'fx', tab: 'view', label: 'ゲーム・ギフト・エモーション演出を表示', desc: '映像に重なる演出です(ニコ生プレイヤーの詳細設定と同じ)。放送者名の右クリックで、枠ごとにも一時的に切り替えられます', short: '演出を表示', ctl: () => mkCb(data.fxOn !== false, 'set-fx') },
      { k: 'top', tab: 'view', label: '最前面に表示', desc: 'メインの窓を、ほかの窓より手前に表示し続けます', ctl: () => mkCb(data.alwaysTop, 'set-top') },
      { k: 'fit', tab: 'view', label: '映像を 1280×720 に合わせる', desc: '拡大中の枠(なければ最初の枠)の映像が 1280×720 になるよう、窓の大きさを変えます', ctl: () => btn('実行', () => window.menu.act('set-fit720', null, true)) },
      { k: 'aoa', tab: 'audio', label: '追加したときに音声を出す', desc: '放送を1枠だけ追加したとき、その枠の音声を最初から出します。OFFだと、いつも消音で始めます', ctl: () => mkCb(data.audioOnAdd !== false, 'set-aoa') },
      { k: 'eaa', tab: 'audio', label: 'ギフトイベントは全枠の音声を出す', desc: 'ギフトイベントの追跡で並んだ枠すべての音声を出します。OFFだと、1位の枠だけです', ctl: () => mkCb(data.evAudioAll, 'set-eaa') },
      { k: 'so', tab: 'audio', label: '追加せず1枠だけで開く', desc: 'フォロー中・検索・URL貼り付けで開くとき、いまの枠を閉じて、その放送だけを開きます(ギフトイベントは対象外)', ctl: () => mkCb(data.singleOpen, 'set-so') },
      { k: 'dockpos', tab: 'viewer', label: 'コメビュの位置', desc: '合体したコメビュを、映像の右か下に置きます', ctl: () => mkSel([['right', '映像の右'], ['bottom', '映像の下']], data.dockPos || 'right', 'set-dockpos') },
      { k: 'hsn', tab: 'viewer', label: 'コメビュに放送者名を表示', desc: 'コメビュの各行の右端に、放送者名(枠)を出します', ctl: () => mkCb(!data.hideSrcName, 'set-hsn') },
      { k: 'vsimple', tab: 'viewer', label: 'コメビュをコメントだけにする', desc: '上のバー・放送の一覧・時刻・名前などを消して、コメントの文字だけを出します', ctl: () => mkCb(data.viewerSimple, 'set-vsimple') },
      { k: 'fwn', tab: 'follow', label: 'フォロー中の放送が始まったら通知', desc: '選んだ放送者の放送が始まったら、Windowsの通知を出します。通知をクリックすると、その放送を枠に追加します', ctl: () => mkCb(data.fwNotify, 'set-fwn') },
      { k: 'fwa', tab: 'follow', label: 'フォロー中の放送が始まったら自動で枠を追加', desc: '選んだ放送者の放送が始まったら、自動で枠を追加します(音声は消音で始まります)', ctl: () => mkCb(data.fwAuto, 'set-fwa') },
    ];
  }
  // 1つの項目の行。 withDesc なら、名前の下に説明を書く(設定ウィンドウ)。なければ、説明はマウスを乗せたときに出す(メニュー)
  function setRow(it, withDesc) {
    const r = el('div', 'srow'), left = el('div', 'sl');
    left.appendChild(el('div', '', withDesc ? it.label : (it.short || it.label)));
    if (withDesc) left.appendChild(el('div', 'sdesc', it.desc)); else r.title = it.desc;
    r.append(left, it.ctl());
    return r;
  }
  // その他(保存先・ログイン・ログ・更新・バージョン)。 full = 設定ウィンドウ
  function setOther(full) {
    const box = el('div');
    if (full) {
      const sd = el('div'); sd.style.cssText = 'padding:8px 0';
      const sh = el('div', 'srow'); sh.style.borderTop = '0'; sh.append(el('span', '', '📷 スクショの保存先'), el('span', 'grow'), btn('変更', () => window.menu.act('set-shotdir', null, true)), btn('開く', () => window.menu.act('set-shotdir-open', null, true)));
      const sp = el('div', 'hint', data.shotDir || ('標準: ' + (data.shotDirDef || ''))); sp.style.cssText = 'word-break:break-all;font-size:12px;line-height:1.5;padding:2px 2px 0';
      sd.append(sh, sp);
      if (data.shotDir) { const rs = el('button', 'lnk', '標準の場所に戻す'); rs.type = 'button'; rs.style.cssText = 'margin:2px 2px 0;font-size:12px'; rs.addEventListener('click', () => window.menu.act('set-shotdir-reset', null, true)); sd.appendChild(rs); }
      box.appendChild(sd);
    }
    const au = el('div', 'srow'), st = el('span', data.loggedIn ? 'ok' : '', data.loggedIn ? 'ログイン中' + (data.loginVia ? ' (' + data.loginVia + ')' : '') : '未ログイン');
    au.append(st, btn(data.loggedIn ? 'ログアウト' : 'ニコニコにログイン', () => window.menu.act('set-auth', null, true))); box.appendChild(au);
    if (!data.loggedIn) {
      const hint = el('div', 'hint'); const lk = el('button', 'lnk', 'ブラウザでログイン'); lk.type = 'button'; lk.title = 'Googleなどで入れないときは、普段のブラウザ(Chrome / Edge)でログインします';
      lk.addEventListener('click', () => window.menu.act('set-browser', null, true)); hint.appendChild(lk); box.appendChild(hint);
    }
    if (full) { const lg = el('div', 'srow'); lg.append(el('span', '', '動作ログ'), btn('ログ', () => window.menu.act('set-log', null, true))); box.appendChild(lg); }
    if (data.update) {
      const up = el('div', 'srow upd'); up.append(el('span', '', `🔔 新しいバージョン v${data.update.latest} があります`), data.update.auto ? btn('更新して再起動', () => window.menu.act('set-update-apply', null, true)) : btn('ダウンロードページを開く', () => window.menu.act('set-update', null, true)));
      box.appendChild(up);
    }
    if (data.appVersion) {
      const vb = el('button', 'ver', 'ニコ生マルチビュー v' + data.appVersion + ' ⓘ'); vb.type = 'button';
      vb.style.cssText = 'display:block;width:100%;background:none;border:0;cursor:pointer;font:inherit;text-decoration:underline dotted;white-space:nowrap';
      vb.title = 'バージョン情報: クリックで、Electron などのバージョンを表示します';
      vb.addEventListener('click', () => window.menu.act('set-about', null, true));
      box.appendChild(vb);
    }
    return box;
  }
  // ⚙のメニュー: よく使う項目だけ + 「すべての設定…」
  function renderSET() {
    root.textContent = '';
    const items = setItems();
    // 並び順は、以前(v1.1.5)のメニューに合わせる。新しい「演出」は、シークバーの下
    const ORDER = ['dockpos', 'theme', 'po', 'aoa', 'eaa', 'so', 'fwn', 'fwa', 'sm', 'seek', 'fx', 'hsn', 'vsimple', 'top', 'fit'];
    ORDER.forEach(k => { const it = items.find(x => x.k === k); if (it) root.appendChild(setRow(it, false)); });
    root.appendChild(setOther(true));
    report();
  }
  // 設定ウィンドウ: すべての項目を、タブで切り替えて出す(説明つき)
  function renderSETALL() {
    const keep = root.scrollTop;
    root.textContent = '';
    document.body.classList.add('setwin');
    const tabs = el('div', 'stabs');
    SET_TABS.forEach(([k, t]) => { const b = el('button', 'stab' + (k === setTab ? ' on' : ''), t); b.type = 'button'; b.addEventListener('click', () => { setTab = k; root.scrollTop = 0; renderSETALL(); }); tabs.appendChild(b); });
    root.appendChild(tabs);
    const body = el('div', 'sbody');
    setItems().filter(x => x.tab === setTab).forEach(it => body.appendChild(setRow(it, true)));
    if (setTab === 'follow') body.appendChild(el('div', 'hint sfoot', '対象にする放送者は、「👥 フォロー中」の一覧で、放送の右の 🔔 を押して選びます(🔕 は対象外。初めは全員が対象外です)。確認は1分おきで、ログインが必要です。'));
    if (setTab === 'other') body.appendChild(setOther(true));
    root.appendChild(body);
    if (type === 'setall') root.scrollTop = keep;
  }

  // 音量バー(枠の🔊/🔇にマウスを乗せたとき)
  function renderVOL() {
    root.textContent = ''; document.body.classList.add('volbody');
    const w = el('div', 'volrow'), x = el('input'), v = el('span', 'volnum');
    x.type = 'range'; x.min = 0; x.max = 100; x.step = 1; x.value = String(data.vol == null ? 50 : data.vol); v.textContent = x.value + '%';
    x.addEventListener('input', () => { v.textContent = x.value + '%'; window.menu.act('vol-set', { id: data.volId, v: Number(x.value) }, true); });
    w.append(x, v); root.appendChild(w); report();
  }
  document.documentElement.addEventListener('mouseenter', () => { if (type === 'vol') window.menu.act('vol-in', null, true); });
  document.documentElement.addEventListener('mouseleave', () => { if (type === 'vol') window.menu.close(); });
  function render() { seq++; flBuilt = false; document.body.classList.toggle('volbody', type === 'vol'); document.documentElement.dataset.theme = data.theme || ''; document.body.classList.toggle('sugmode', type === 'sug'); if (type === 'sug') renderSUG(); else if (type === 'pp') renderPP(); else if (type === 'ev') renderEV(); else if (type === 'fl') renderFL(true); else if (type === 'fm') renderFM(); else if (type === 'hm') renderHM(); else if (type === 'dlg') renderDLG(); else if (type === 'set') renderSET(); else if (type === 'setall') renderSETALL(); else if (type === 'vol') renderVOL(); }
  window.menu.onShow((t, d) => { type = t; data = d || {}; render(); });
  // 保存・追加などで内容が変わったとき(イベント一覧は取り直さない)
  window.menu.onData(d => { data = d || {}; document.documentElement.dataset.theme = data.theme || ''; if (type === 'sug') renderSUG(); else if (type === 'pp') renderPP(); else if (type === 'ev') { evN = data.evN || evN; renderEV(); } else if (type === 'fl') renderFL(false); else if (type === 'set') renderSET(); else if (type === 'setall') renderSETALL(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') window.menu.close(); });
})();
</script></body></html>
