<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>menu</title>
<style>
:root{
  --bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--text:#e8eaf0;--sub:#9aa3b2;--accent:#4da3ff;--danger:#ff6b6b;--ok:#5fd38d;
  --input:#0c0e12;--btn:#232834;--btnhv:#44507a;--onaccent:#06121f;--tilebg:#05070a;--stagebg:#000;--tagbg:#000a;
  --hl:#1d3a5c;--dragbg:#0b0e14;--dragon:#14263d;--chip:#161a22;--hover:#ffffff0a;--rowline:#ffffff08;
  --c0:#4da3ff;--c1:#ff8a5c;--c2:#5fd38d;--c3:#e0b341;--c4:#c78bff;--c5:#ff6fa8;--c6:#4fd1d9;--c7:#a3b86c;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6fa;--panel:#ffffff;--line:#d3d9e3;--text:#1a1f2b;--sub:#5b6577;--accent:#1a73e8;--danger:#d93025;--ok:#188038;
    --input:#ffffff;--btn:#eef1f6;--btnhv:#9db4dc;--onaccent:#ffffff;--tilebg:#dfe4ec;--stagebg:#e6eaf1;--tagbg:#ffffffd9;
    --hl:#cfe0fb;--dragbg:#e3e8f0;--dragon:#cfe0fb;--chip:#f0f3f8;--hover:#0000000a;--rowline:#00000010;
    --c0:#1a73e8;--c1:#d9531e;--c2:#188038;--c3:#9a6b00;--c4:#8a3ffc;--c5:#c2185b;--c6:#00838f;--c7:#5d6f1f;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--panel);color:var(--text);font-family:"Noto Sans JP","Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;font-size:14px;overflow:hidden}
body{border:1px solid var(--line);border-radius:8px}
#root{padding:12px;max-height:100vh;overflow:auto}
h2{margin:0 0 8px;font-size:15px}
.hint{font-size:12px;color:var(--sub)}
input[type=text]{min-width:0;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--text);font:inherit}
input[type=text]:focus{outline:2px solid var(--accent)}
button,select{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--btnhv)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row input[type=text]{flex:1;min-width:160px}
.sgmsg{padding:14px;color:var(--sub);text-align:center;font-size:13px}
.evi{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.evi:hover,.evi.on{background:var(--hl)}
.evi .k{font-size:11px;color:var(--sub);font-weight:400}
.evi .t{flex:1;min-width:0;font-weight:700;font-size:13px}
.sg{display:flex;gap:10px;align-items:center;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.sg:last-child{border-bottom:0}
.sg.on{background:var(--hl)}
.sg img{width:80px;height:45px;object-fit:cover;border-radius:4px;background:var(--tilebg);flex:0 0 auto}
.sg .tx{min-width:0;flex:1}
.sg .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .tt{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .mt{font-size:11px;color:var(--sub)}
.sg .ad{font-size:12px;color:var(--ok);flex:0 0 auto;display:none}
.sg.added .ad{display:block}
body.sugmode #root{padding:0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.srow+.srow{border-top:1px solid var(--line)}
.srow.upd{flex-wrap:wrap;color:var(--accent);font-size:13px}
.hint{padding:0 0 6px;margin-top:-2px}
.lnk{background:none;border:0;padding:0;font:inherit;font-size:12px;color:var(--accent);text-decoration:underline;cursor:pointer;text-align:left}
.srow .ok{color:var(--ok);font-size:12px}
.ver{text-align:right;font-size:12px;color:var(--sub);padding-top:6px;border-top:1px solid var(--line)}

/* ガラステーマ: メニューも、ガラス風のパネルにする(後ろは映像のビューなので、見やすさのため透け具合は控えめ) */
:root[data-theme="glassb"]{--panel:rgba(30,32,46,.9);--line:rgba(255,255,255,.18);--text:#f3f4f8;--sub:#aab0c4;--accent:#7fb2ff;--input:rgba(0,0,0,.32);--btn:rgba(255,255,255,.09);--btnhv:#7fb2ff;--onaccent:#08142b;--hl:rgba(127,178,255,.28);--chip:rgba(255,255,255,.08);color-scheme:dark}
:root[data-theme="glassc"]{--panel:rgba(255,255,255,.9);--line:rgba(0,0,0,.12);--text:#1c1f26;--sub:#5d6475;--accent:#0a84ff;--input:rgba(255,255,255,.85);--btn:rgba(255,255,255,.85);--btnhv:#0a84ff;--onaccent:#fff;--hl:rgba(10,132,255,.18);--chip:rgba(0,0,0,.05);color-scheme:light}
:root[data-theme="glassf"]{--panel:rgba(10,10,14,.9);--line:rgba(255,255,255,.12);--text:#ececf2;--sub:#9a9cab;--accent:#8ab4ff;--input:rgba(255,255,255,.08);--btn:rgba(255,255,255,.07);--btnhv:#8ab4ff;--onaccent:#071228;--hl:rgba(138,180,255,.25);--chip:rgba(255,255,255,.07);color-scheme:dark}
:root[data-theme^="glass"] body{border-color:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 28px rgba(0,0,0,.45);background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 40%)}
:root[data-theme="glassc"] body{border-color:rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(40,60,100,.3);background-image:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 40%)}
:root[data-theme^="glass"] button,:root[data-theme^="glass"] select{border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}

/* 選択肢の一覧は、背景が透けないよう、はっきりした色にする */
:root[data-theme="glassb"] option{background:#232638;color:#f3f4f8}
:root[data-theme="glassf"] option{background:#14141b;color:#ececf2}
:root[data-theme="glassc"] option{background:#ffffff;color:#1c1f26}
</style></head><body><div id="root"></div>
<script>
(() => {
  'use strict';
  const root = document.getElementById('root');
  let type = '', data = {}, seq = 0;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const btn = (label, fn, title) => { const b = el('button', '', label); b.type = 'button'; if (title) b.title = title; b.addEventListener('click', fn); return b; };
  const fmtEnd = sec => { const d = new Date(sec * 1000); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const keyOf = t => { const m = String(t || '').match(/auditions\/([\w-]{1,80})/) || String(t || '').trim().match(/^([\w-]{1,80})$/); return m ? m[1] : ''; };
  const report = () => requestAnimationFrame(() => window.menu.size(root.scrollHeight + 2));
  const textInput = ph => { const i = el('input'); i.type = 'text'; i.placeholder = ph; i.autocomplete = 'off'; return i; };

  /* ---- 枠の保存 ---- */
  let ppDraft = '';
  function renderPP() {
    root.textContent = '';
    root.appendChild(el('h2', '', '📁 枠の保存'));
    const row = el('div', 'row'), name = textInput('保存名'); name.value = ppDraft; name.addEventListener('input', () => { ppDraft = name.value; });
    const save = () => { window.menu.act('pp-save', name.value, true); ppDraft = ''; };
    name.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) save(); });
    row.append(name, btn('いまの枠を保存', save), btn('閉じる', () => window.menu.close()));
    root.appendChild(row);
    const L = el('div');
    if (!data.presets || !data.presets.length) L.appendChild(el('div', 'sgmsg', '保存した枠はまだありません'));
    (data.presets || []).forEach((p, i) => {
      const d = el('div', 'evi'), t = el('div', 't', p.name);
      t.appendChild(el('div', 'k', `${p.items.length}枠: ` + p.items.map(id => (data.names && data.names[id]) || id).join('、')));
      d.append(t, btn('開く', e => { e.stopPropagation(); window.menu.act('pp-open', i); }), btn('削除', e => { e.stopPropagation(); window.menu.act('pp-del', i, true); }));
      L.appendChild(d);
    });
    root.appendChild(L); report();
  }

  /* ---- ギフトイベント ---- */
  let evN = 4, evKeyDraft = '';
  async function renderEV() {
    const my = ++seq;
    evN = data.evN || evN;
    root.textContent = '';
    root.appendChild(el('h2', '', '🎁 ギフトイベントの上位者を自動表示'));
    root.appendChild(el('div', 'hint', '開催中のイベントを選ぶと、上位者のうち「いま放送中」の人の枠を順位順に並べ、順位が変わると枠も自動で入れ替わります(1分ごとに更新)。'));
    const row = el('div', 'row'), sel = el('select');
    for (let i = 1; i <= 12; i++) sel.add(new Option(String(i), String(i)));
    sel.value = String(evN); sel.addEventListener('change', () => { evN = Number(sel.value) || 4; });
    const lab = el('label'); lab.append('表示する順位 上位 ', sel, ' 位まで');
    row.append(lab, btn('一覧を更新', renderEV), btn('閉じる', () => window.menu.close()));
    root.appendChild(row);
    const L = el('div'); L.appendChild(el('div', 'sgmsg', '開催中のイベントを探しています…')); root.appendChild(L); report();
    let r; try { r = await window.menu.evList(data.evKeys || []); } catch { r = null; }
    if (my !== seq) return;
    L.textContent = '';
    if (!r || !r.ok || !r.events.length) { L.appendChild(el('div', 'sgmsg', 'イベントが見つかりませんでした。')); report(); return; }
    r.events.forEach(e => {
      const d = el('div', 'evi' + (data.evTrack && data.evTrack.key === e.key ? ' on' : '')), t = el('div', 't', e.title);
      t.appendChild(el('div', 'k', (e.kind === 'gift' ? '🎁 ギフト' : e.kind === 'ad' ? '📣 ニコニ広告' : '🏆 イベント') + ` / 〜${fmtEnd(e.end)}` + (e.entries ? ` / 参加${e.entries}人` : '')));
      d.append(t, btn('追跡開始', () => {}));
      d.addEventListener('click', () => window.menu.act('ev-track', { event: e, n: evN }));
      L.appendChild(d);
    });
    report();
  }

  /* ---- フォロー中の放送 ---- */
  let flList = null, flErr = '', flBuilt = false, flL = null, flMsg = null, flRef = null, flRows = new Map();
  // 画面を作り直さず、変わったところだけ更新する(押したボタンやサムネイルが一瞬消えて、点滅するのを防ぐ)
  async function renderFL(refetch, force) {
    const my = ++seq;
    if (!flBuilt) {
      root.textContent = ''; flRows = new Map();
      root.appendChild(el('h2', '', '👥 フォロー中の放送'));
      const row = el('div', 'row');
      flRef = btn('一覧を更新', () => renderFL(true, true));
      row.append(flRef, btn('すべて追加', () => { const ids = (flList || []).map(x => x.id).filter(id => !(data.items || []).includes(id)); if (ids.length) window.menu.act('fl-all', ids, true); }), btn('閉じる', () => window.menu.close()));
      root.appendChild(row);
      flMsg = el('div', 'sgmsg'); flMsg.style.display = 'none'; root.appendChild(flMsg);
      flL = el('div'); root.appendChild(flL);
      flBuilt = true;
    }
    const paint = (busy) => {
      const have = data.items || [];
      let msg = '';
      if (!flList) msg = busy ? 'フォロー中の放送を探しています…' : (flErr || '取得できませんでした');
      else if (!flList.length && !busy) msg = 'いま放送中のフォロー中の番組はありません。';
      else if (busy) msg = '更新しています…';
      flMsg.textContent = msg; flMsg.style.display = msg ? '' : 'none';
      const want = flList || [], ids = new Set(want.map(x => x.id));
      for (const [id, r] of flRows) if (!ids.has(id)) { r.remove(); flRows.delete(id); }
      want.forEach((it, i) => {
        let r = flRows.get(it.id);
        if (!r) {
          r = el('div', 'sg');
          const img = el('img'); img.alt = ''; if (it.thumb) img.src = it.thumb;
          const tx = el('div', 'tx');
          tx.append(el('div', 'nm', it.name || it.title || it.id), el('div', 'tt', it.name ? it.title : ''), el('div', 'mt', it.id + (it.watch ? ` ・ 来場 ${Number(it.watch).toLocaleString('ja-JP')}` : '')));
          r.append(img, tx, el('div', 'ad', '✓ 追加済み'));
          r.addEventListener('click', () => { if (!(data.items || []).includes(it.id)) window.menu.act('fl-add', it.id, true); });
          flRows.set(it.id, r);
        } else {
          const nm = r.querySelector('.nm'), mt = r.querySelector('.mt');
          const t = it.name || it.title || it.id, m = it.id + (it.watch ? ` ・ 来場 ${Number(it.watch).toLocaleString('ja-JP')}` : '');
          if (nm && nm.textContent !== t) nm.textContent = t;
          if (mt && mt.textContent !== m) mt.textContent = m;
        }
        r.classList.toggle('added', have.includes(it.id));
        if (flL.children[i] !== r) flL.insertBefore(r, flL.children[i] || null);
      });
      flRef.disabled = !!busy;
      report();
    };
    // 前に取れた一覧が残っていれば、先にそれを出して、裏で新しくする(開くのを待たせない)
    if (refetch || !flList) {
      paint(true);
      let r; try { r = await window.menu.followList(!!force); } catch { r = null; }
      if (my !== seq) return;
      if (!r || !r.ok) { if (!flList || force) { flList = null; flErr = (r && r.error) || '取得できませんでした'; } } else { flList = r.list; flErr = ''; }
    }
    paint(false);
  }

  /* ---- 枠の放送者名の右クリックメニュー ---- */
  function renderFM() {
    root.textContent = '';
    root.appendChild(el('h2', '', data.fmName || data.fmId || '放送'));
    const mk = (label, act) => { const b = el('button', 'lnk', label); b.type = 'button'; b.style.cssText = 'display:block;width:100%;text-align:left;padding:9px 6px;font-size:14px;text-decoration:none;color:inherit'; b.addEventListener('click', () => window.menu.act(act, data.fmId, false)); return b; };
    root.append(mk('放送の詳細を表示', 'fm-detail'), mk('放送のURLをコピー', 'fm-url'), mk('放送者のユーザーページを開く', 'fm-user'));
    report();
  }

  /* ---- 追跡開始の確認 ---- */
  let dlgDraft = '';
  function renderDLG() {
    root.textContent = '';
    root.appendChild(el('h2', '', '今開いている枠を閉じて追跡を始めます'));
    const names = data.dlgNames || [];
    root.appendChild(el('div', 'hint', `いま開いている ${data.dlgCount || 0} 枠(${names.slice(0, 4).join('、')}${(data.dlgCount || 0) > 4 ? ' ほか' : ''})はすべて閉じます。保存しますか?`));
    const name = textInput('保存名(例: いつもの枠)'); name.value = dlgDraft; name.addEventListener('input', () => { dlgDraft = name.value; });
    const r1 = el('div', 'row'); r1.appendChild(name); root.appendChild(r1);
    const go = (a) => { const v = name.value; dlgDraft = ''; window.menu.act(a, v); };
    const r2 = el('div', 'row'); r2.append(btn('保存して開始', () => go('dlg-save')), btn('保存せずに開始', () => go('dlg-no')), btn('キャンセル', () => go('dlg-cancel')));
    root.appendChild(r2); report();
  }

  /* ---- 検索候補(入力欄は本体側。ここは表示と選択だけ) ---- */
  function renderSUG() {
    const keep = root.scrollTop; root.textContent = '';
    const s = data.sug || {};
    if (s.msg) { root.appendChild(el('div', 'sgmsg', s.msg)); report(); return; }
    (s.items || []).forEach((it, i) => {
      const row = el('div', 'sg' + (i === s.idx ? ' on' : '') + ((s.added || []).includes(it.id) ? ' added' : ''));
      const img = el('img'); img.alt = ''; if (it.thumb) img.src = it.thumb;
      const tx = el('div', 'tx');
      tx.append(el('div', 'nm', it.name || it.id), el('div', 'tt', it.title), el('div', 'mt', `${it.id} ・ 来場 ${Number(it.watch).toLocaleString('ja-JP')}${it.type === 'channel' ? ' ・ チャンネル' : it.type === 'official' ? ' ・ 公式' : ''}`));
      row.append(img, tx, el('div', 'ad', '✓ 追加済み'));
      row.addEventListener('mousedown', e => e.preventDefault());
      row.addEventListener('mouseenter', () => { root.querySelectorAll('.sg').forEach((r, j) => r.classList.toggle('on', j === i)); window.menu.act('sug-hover', i, true); });
      row.addEventListener('click', () => window.menu.act('sug-pick', i, true));
      root.appendChild(row);
    });
    root.scrollTop = keep;
    const on = root.querySelector('.sg.on'); if (on && s.scroll) on.scrollIntoView({ block: 'nearest' });
    report();
  }

  /* ---- 設定 ---- */
  function renderSET() {
    root.textContent = '';
    const row = (label, ctl) => { const r = el('div', 'srow'); r.append(el('span', '', label), ctl); root.appendChild(r); };
    const sel = (opts, cur, act) => { const s = el('select'); opts.forEach(([v, t]) => s.add(new Option(t, v))); s.value = cur; s.addEventListener('change', () => window.menu.act(act, s.value, true)); return s; };
    row('テーマ', sel([['system', '自動'], ['light', 'ライト'], ['dark', 'ダーク'], ['glassb', 'ガラス(Windows 11風)'], ['glassc', 'ガラス(明るい)'], ['glassf', 'ガラス(スモーク)']], data.theme || 'system', 'set-theme'));
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = data.playerOnly !== false; cb.title = 'OFFにすると視聴ページ全体を表示します';
    cb.addEventListener('change', () => window.menu.act('set-po', cb.checked, true));
    row('プレイヤーのみ', cb);
    const ab = el('input'); ab.type = 'checkbox'; ab.checked = data.audioOnAdd !== false; ab.title = '放送を1枠追加したとき、その枠の音声を出します(OFFだと、いつも消音で始めます)';
    ab.addEventListener('change', () => window.menu.act('set-aoa', ab.checked, true));
    row('追加したときに音声を出す', ab);
    const ea = el('input'); ea.type = 'checkbox'; ea.checked = !!data.evAudioAll; ea.title = 'ギフトイベントの追跡で並んだ枠すべての音声を出します(OFFだと1位の枠だけ)';
    ea.addEventListener('change', () => window.menu.act('set-eaa', ea.checked, true));
    row('ギフトイベントは全枠の音声を出す', ea);
    const so = el('input'); so.type = 'checkbox'; so.checked = !!data.singleOpen; so.title = 'ONにすると、フォロー中・検索・URL貼り付けで開くとき、いまの枠を閉じて、その放送だけを開きます(ギフトイベントは対象外)';
    so.addEventListener('change', () => window.menu.act('set-so', so.checked, true));
    row('追加せず1枠だけで開く', so);
    const sm = el('input'); sm.type = 'checkbox'; sm.checked = data.showSm !== false; sm.title = 'OFFにすると、ギフトイベントの順位つきの枠で、名前の横に出る召喚獣の個数(召・改・神)を表示しません';
    sm.addEventListener('change', () => window.menu.act('set-sm', sm.checked, true));
    row('召喚獣の個数を表示', sm);
    const sk = el('input'); sk.type = 'checkbox'; sk.checked = data.seekOn !== false; sk.title = 'OFFにすると、映像の下のシークバー(タイムシフトの巻き戻し)を出さず、操作できなくします';
    sk.addEventListener('change', () => window.menu.act('set-seek', sk.checked, true));
    row('シークバーを使う', sk);
    const hs = el('input'); hs.type = 'checkbox'; hs.checked = !data.hideSrcName; hs.title = 'OFFにすると、コメビュの各行の右端の放送者名(枠)を表示しません';
    hs.addEventListener('change', () => window.menu.act('set-hsn', hs.checked, true));
    row('コメビュに放送者名を表示', hs);
    const vs = el('input'); vs.type = 'checkbox'; vs.checked = !!data.viewerSimple; vs.title = 'ONにすると、コメビュに、コメントの文字だけを表示します(上のバー・放送の一覧・時刻・名前などを消します)';
    vs.addEventListener('change', () => window.menu.act('set-vsimple', vs.checked, true));
    row('コメビュをコメントだけにする', vs);
    const tp = el('input'); tp.type = 'checkbox'; tp.checked = !!data.alwaysTop; tp.title = 'ONにすると、メインの窓を、ほかの窓より手前(最前面)に表示し続けます';
    tp.addEventListener('change', () => window.menu.act('set-top', tp.checked, true));
    row('最前面に表示', tp);
    const fr = el('div', 'srow'); fr.title = '拡大中の枠(なければ最初の枠)の映像が 1280×720 になるよう、窓の大きさを変えます。画面に収まらない場合は、できる範囲までです';
    fr.append(el('span', '', '映像を 1280×720 に合わせる'), btn('実行', () => window.menu.act('set-fit720', null, false)));
    root.appendChild(fr);
    const sd = el('div'); sd.style.cssText = 'padding:8px 0;border-top:1px solid var(--line,#ddd)';
    const sh = el('div', 'srow'); sh.append(el('span', '', '📷 スクショの保存先'), btn('変更', () => window.menu.act('set-shotdir', null, true)), btn('開く', () => window.menu.act('set-shotdir-open', null, true)));
