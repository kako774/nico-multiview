<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https://*.nicovideo.jp https://*.nimg.jp">
<title>ニコ生マルチビュー</title>
<style>
:root{
  --bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--text:#e8eaf0;--sub:#9aa3b2;--accent:#4da3ff;--danger:#ff6b6b;--ok:#5fd38d;
  --input:#0c0e12;--btn:#232834;--btnhv:#44507a;--onaccent:#06121f;--tilebg:#05070a;--stagebg:#000;--tagbg:#000a;
  --hl:#1d3a5c;--dragbg:#0b0e14;--dragon:#14263d;--chip:#161a22;--hover:#ffffff0a;--rowline:#ffffff08;
  --c0:#4da3ff;--c1:#ff8a5c;--c2:#5fd38d;--c3:#e0b341;--c4:#c78bff;--c5:#ff6fa8;--c6:#4fd1d9;--c7:#a3b86c;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6fa;--panel:#ffffff;--line:#d3d9e3;--text:#1a1f2b;--sub:#5b6577;--accent:#1a73e8;--danger:#d93025;--ok:#188038;
    --input:#ffffff;--btn:#eef1f6;--btnhv:#9db4dc;--onaccent:#ffffff;--tilebg:#dfe4ec;--stagebg:#e6eaf1;--tagbg:#ffffffd9;
    --hl:#cfe0fb;--dragbg:#e3e8f0;--dragon:#cfe0fb;--chip:#f0f3f8;--hover:#0000000a;--rowline:#00000010;
    --c0:#1a73e8;--c1:#d9531e;--c2:#188038;--c3:#9a6b00;--c4:#8a3ffc;--c5:#c2185b;--c6:#00838f;--c7:#5d6f1f;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Noto Sans JP","Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;font-size:14px}
body{display:flex;flex-direction:column;overflow:hidden;user-select:none}
#bar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar h1{font-size:15px;margin:0 6px 0 0;white-space:nowrap}
#addForm{position:relative;display:flex;gap:6px;flex:1 1 320px;min-width:220px;max-width:560px}
input[type=text]{min-width:0;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--text);font:inherit;user-select:text}
input[type=text]:focus{outline:2px solid var(--accent)}
input[type=text]:disabled{opacity:.55}
#addInput{flex:1}
.sgmsg{padding:14px;color:var(--sub);text-align:center;font-size:13px}
button,select{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover:not(:disabled),select:hover{border-color:var(--btnhv)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:700}
.chk{display:flex;align-items:center;gap:5px;color:var(--sub);cursor:pointer;white-space:nowrap}
#setBtn{margin-left:auto}
#setPanel{display:none}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.srow+.srow{border-top:1px solid var(--line)}
.srow label{color:var(--text)}
.srow.ver{justify-content:flex-end;font-size:12px;color:var(--sub)}
#authState{font-size:12px;color:var(--sub);white-space:nowrap}
#authState.in{color:var(--ok)}
#evBtn.on{background:var(--btnhv)}
#evChip{display:none;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:12px;max-width:300px}
#evChip.show{display:inline-flex}#evChip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evi{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.evi:hover,.evi.on{background:var(--hl)}
.evi .k{font-size:11px;color:var(--sub)}
.evi .t{flex:1;min-width:0;font-weight:700;font-size:13px}
.rk{font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;background:#e8b923;color:#222;margin-right:5px}
.rk{background:#8aa4d6;color:#10203a}
.rk.r1{background:linear-gradient(135deg,#ffe27a,#e0a800);color:#3a2a00}
.rk.r2{background:linear-gradient(135deg,#f1f4f8,#aab3bf);color:#2a313b}
.rk.r3{background:linear-gradient(135deg,#e8a56a,#b0662a);color:#2e1604}
.sm{display:inline-flex;gap:3px;margin-left:5px;vertical-align:middle}
.sm i{font-style:normal;font-size:10px;font-weight:800;padding:0 3px;border-radius:5px;color:#fff}
.sm{margin-left:3px;gap:2px}
.head button.live{font-weight:800;font-size:13px;letter-spacing:.03em;color:#fff;background:#d93025;border-color:#d93025}
.head button.live:hover{filter:brightness(1.1)}
.tile.rkd .tag{flex:0 1 auto;min-width:8em}.tile.rkd .tag .tt{min-width:2em}
.tile{container-type:inline-size}
@container (max-width:620px){.head .vol,.head .volv{display:none}}
@container (max-width:460px){.head button.rw,.head .grow{display:none}}
.sm .n{background:#8e57d9}.sm .k{background:#e8782a}.sm .g{background:linear-gradient(90deg,#e0457b,#e8b923,#3fb6d9)}
.sm i.z{opacity:.35}
.tag{display:inline-flex;align-items:center;min-width:0}.tag .tt{overflow:hidden;text-overflow:ellipsis}.tag .rk,.tag .sm{flex:none}
.tile.g1{border-color:#e0a800;box-shadow:inset 0 0 0 1px #e0a800}
.tile.g2{border-color:#aab3bf;box-shadow:inset 0 0 0 1px #aab3bf}
.tile.g3{border-color:#b0662a;box-shadow:inset 0 0 0 1px #b0662a}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.row2 input[type=text]{flex:1;min-width:180px}
#msg{font-size:12px;color:var(--sub);width:100%;display:none}
#msg.show{display:block}#msg.err{color:var(--danger)}
body.fs #bar,body.clean #bar{display:none}
#wrap{position:relative;flex:1 1 auto;min-height:0;background:var(--stagebg)}
#stage{position:absolute;inset:0;display:grid;gap:4px;padding:4px}
.tile{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--line);border-radius:4px;background:var(--tilebg);overflow:hidden}
.tile.dragover{outline:3px solid var(--accent);outline-offset:-3px}
.tile.dragover .head{background:var(--hl)}
.tile.dragsrc{opacity:.5}
.head{user-select:none}
/* ドラッグ中: 隠れた映像の代わりに、放送者名を大きく出してドロップ先にする */
body.dragmode .content{display:flex;align-items:center;justify-content:center;font-size:clamp(14px,2.2vw,30px);font-weight:700;
  color:var(--sub);text-align:center;padding:12px;background:var(--dragbg)}
body.dragmode .content::after{content:attr(data-label);word-break:break-all}
body.dragmode .tile.dragover .content{color:var(--text);background:var(--dragon)}
body.dragmode .tile.dragsrc .content::after{content:attr(data-label) "\A(移動中)";white-space:pre}
.head{flex:0 0 36px;overflow:hidden;font-size:15px;display:flex;gap:5px;align-items:center;padding:0 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.head button.cm.off{opacity:.55;text-decoration:line-through}
.vol{width:110px;height:14px;accent-color:var(--accent);cursor:pointer;flex:0 1 110px;min-width:28px;margin:0 2px}
.volv{font-size:11px;color:var(--sub);min-width:3em;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
.tag{font-size:14px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--tagbg);cursor:grab;
  min-width:3.6em;max-width:none;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .grow{flex:1;min-width:0}
.head button{flex:0 0 auto;padding:4px 9px;font-size:15px;border-radius:5px;white-space:nowrap}
.head button.on{border-color:var(--accent);color:var(--accent)}
.head button.close:hover{border-color:var(--danger);color:var(--danger)}
.content{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.content::before{content:'読み込み中…';color:var(--sub);font-size:15px}
body.dragmode .content::before{display:none}
.foot{flex:0 0 32px;display:none;gap:4px;align-items:center;padding:3px 4px;background:var(--panel);border-top:1px solid var(--line)}
body.showCmt .foot{display:flex}
.foot input{flex:1;padding:3px 8px;font-size:13px;border-radius:6px}
.foot button{padding:2px 10px;font-size:12px;border-radius:6px}
#empty{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--sub);padding:24px;line-height:1.9}
#empty.show{display:grid}
#empty b{color:var(--text);font-size:17px}
#empty code{background:var(--btn);padding:1px 6px;border-radius:4px}
</style>
</head>
<body class="showCmt">
<div id="bar">
  <h1>ニコ生マルチビュー</h1>
  <form id="addForm" autocomplete="off">
    <input id="addInput" type="text" placeholder="放送者名で検索 / lv番号 / 放送URL(複数まとめて貼付OK)" aria-label="放送を追加">
    <button class="primary" type="submit">追加</button>
  </form>
  <select id="layout" aria-label="配置">
    <option value="auto">自動グリッド</option>
    <option value="main">メイン + サブ</option>
    <option value="row">横一列</option>
    <option value="col">縦一列</option>
  </select>
  <label class="chk" title="各枠の下にコメント入力欄を出します"><input id="showCmt" type="checkbox" checked>コメント欄</label>
  <label class="chk" title="184(投稿者を表示しない)でコメントします"><input id="use184" type="checkbox">184</label>
  <button id="muteAll" type="button" title="全枠の音声を一括でOFF / ON">全て消音</button>
  <button id="cleanBtn" type="button" title="検索窓・ボタン・音量・コメント欄を隠して、映像の枠だけを表示します(F10)。画面の一番上にカーソルを持っていくと戻るボタンが出ます">枠のみ</button>
  <button id="fsBtn" type="button" title="全画面(F11)。上のバーを隠して、枠だけを全画面で表示します。Escで戻ります">⛶ 全画面</button>
  <button id="ppBtn" type="button" title="いま開いている枠を保存/呼び出し">📁 枠の保存</button>
  <button id="evBtn" type="button" title="ギフトイベントの上位者の放送を自動で並べる">🎁 ギフトイベント</button>
  <div id="evChip"><span id="evChipT"></span><button id="evStop" type="button" title="追跡をやめる(枠はそのまま残ります)">✕</button></div>
  <button id="viewerBtn" type="button" title="全枠のコメントをまとめて表示する別窓を開く">コメントビューア</button>
  <button id="clearBtn" type="button">全部閉じる</button>
  <button id="setBtn" type="button" title="テーマ・プレイヤーのみ・ログイン">⚙ 設定</button>
  <div id="msg" role="status"></div>
</div>
<div id="setPanel" hidden>
  <div class="srow"><label for="theme">テーマ</label>
    <select id="theme" aria-label="テーマ" title="画面の明るさ">
      <option value="system">自動</option><option value="light">ライト</option><option value="dark">ダーク</option>
    </select></div>
  <div class="srow"><label for="playerOnly">プレイヤーのみ</label>
    <input id="playerOnly" type="checkbox" checked title="OFFにすると視聴ページ全体を表示します"></div>
  <div class="srow"><span id="authState">未ログイン</span><button id="authBtn" type="button">ニコニコにログイン</button></div>
  <div class="srow ver"><span id="verText">バージョン</span></div>
</div>
<div id="wrap">
  <div id="stage"></div>
  <div id="empty" class="show">
    <div><b>見たい放送を追加してください</b><br>
    上の入力欄に <code>lv123456789</code> または放送ページのURLを貼って「追加」<br>
    複数まとめて貼ると一度に並びます(最大12枠)。音声は「🔊」を押した1枠だけ出ます<br>
    コメントするには、右上の「ニコニコにログイン」からログインしてください</div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const MAX = 12;
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), emptyEl = $('#empty'), msg = $('#msg'), layoutSel = $('#layout');
  let items = [], layout = 'auto', audioIds = [];   // 音声ONの枠(複数可)
  let playerOnly = true, showCmt = true, use184 = false, loggedIn = false;
  let theme = 'system';
  let hideCmts = {};   // 枠ごとの「流れるコメントを隠す」
  let volumes = {}, lastVol = 0.5;   // 枠ごとの音量(0〜1)と、最後に動かした音量(新しい枠の初期値)
  let presets = [];   // 保存した枠 { name, items }
  let evTrack = null, evKeys = [];   // 追跡中のイベント { key, title, n } / 手入力したイベントのキー
  let evSig = null, evTimer = 0, evBusy = false, evGen = 0;   // evGen: 追跡を切り替えたときに、古い取得結果を捨てるための番号
  const ranks = new Map();   // lv番号 -> { rank, score }
  let evLvs = [];            // 自動で管理している枠
  const infos = new Map();   // lv番号 -> { name: 放送者名, title: 番組名 }

  const parseIds = t => [...new Set((String(t || '').match(/lv\d+/gi) || []).map(s => s.toLowerCase()))];
  const persist = () => window.mv.save({ items, layout, audioIds, playerOnly, showCmt, use184, volumes, lastVol, hideCmts, theme, evTrack, evKeys, presets });
  // 表示名: 放送者名(取得できるまではlv番号)
  const nameOf = id => (infos.get(id) && infos.get(id).name) || id;

  let msgTimer;
  function say(text, err) {
    msg.textContent = text; msg.className = 'show' + (err ? ' err' : '');
    clearTimeout(msgTimer); msgTimer = setTimeout(() => { msg.className = ''; layoutNow(); }, 4500);
    layoutNow();
  }

  /* ---------- ログイン表示 ---------- */
  function renderAuth() {
    $('#authState').textContent = loggedIn ? 'ログイン中' : '未ログイン';
    $('#authState').className = loggedIn ? 'in' : '';
    $('#authBtn').textContent = loggedIn ? 'ログアウト' : 'ニコニコにログイン';
    if (menuType === 'set') window.mv.menuData(menuData());
    document.querySelectorAll('.foot').forEach(f => {
      const i = f.querySelector('input'), b = f.querySelector('button');
      i.disabled = b.disabled = !loggedIn;
      i.placeholder = loggedIn ? 'コメントを入力(Enterで送信)' : 'ログインするとコメントできます';
    });
  }

  /* ---------- ラベル(放送者名) ---------- */
  function updateTags() {
    [...stage.children].forEach((t, i) => {
      const id = t.dataset.id, info = infos.get(id);
      const tag = t.querySelector('.tag');
      const rk = ranks.get(id);
      tag.textContent = '';
      if (rk) { const b = document.createElement('span'); b.className = 'rk r' + rk.rank; b.textContent = (rk.rank <= 3 ? ['🥇', '🥈', '🥉'][rk.rank - 1] + ' ' : '') + rk.rank + '位'; tag.appendChild(b); }
      const tt = document.createElement('span'); tt.className = 'tt';
      tt.textContent = (layout === 'main' && i === 0 ? '★ ' : '') + nameOf(id) + (rk ? ` ${rk.score.toLocaleString('ja-JP')}pt` : '');
      tag.appendChild(tt);
      if (rk && rk.sm) {
        const w = document.createElement('span'); w.className = 'sm'; w.title = '召喚獣の数(通常 / 改 / 神)';
        [['n', '召', rk.sm.normal], ['k', '改', rk.sm.kai], ['g', '神', rk.sm.god]].forEach(([c, l, v]) => { const e = document.createElement('i'); e.className = c + (v ? '' : ' z'); e.textContent = `${l}${v}`; e.title = ({ n: '召喚獣', k: '召喚獣 改', g: '召喚獣 神' })[c] + ` ${v}個`; w.appendChild(e); });
        tag.appendChild(w);
      }
      t.classList.toggle('rkd', !!rk); t.classList.remove('g1', 'g2', 'g3'); if (rk && rk.rank <= 3) t.classList.add('g' + rk.rank);
      tag.title = nameOf(id) + '\n' + (info && info.title ? `${info.title}\n` : '') + id + '\nドラッグで並べ替え';
    });
  }

  /* ---------- 配置 ---------- */
  // ダブルクリックでその枠だけを表示(もう一度ダブルクリック / Escで元に戻る)
  let focusId = '';
  let cleanMode = false;   // 「枠のみ」表示(上の操作バーだけ隠す)。保存はしない
  function setClean(on) {
    cleanMode = !!on; document.body.classList.toggle('clean', cleanMode);
    $('#cleanBtn').classList.toggle('on', cleanMode); window.mv.cleanState(cleanMode);
    layoutNow(); setTimeout(layoutNow, 150);
  }
  function toggleFocus(id) {
    if (focusId === id) { focusId = ''; say('元の表示に戻しました'); }
    else if (items.includes(id)) { focusId = id; say(`${nameOf(id)} だけを表示中(もう一度ダブルクリックかEscで戻る)`); }
    render();
  }
  function applyGrid() {
    const n = items.length;
    stage.style.gridTemplateColumns = stage.style.gridTemplateRows = '';
    if (focusId && !items.includes(focusId)) focusId = '';
    [...stage.children].forEach(t => { t.style.display = focusId && t.dataset.id !== focusId ? 'none' : ''; });
    if (!n) return;
    if (focusId) {
      stage.style.gridTemplateColumns = stage.style.gridTemplateRows = '1fr';
      [...stage.children].forEach(t => { t.style.gridColumn = t.style.gridRow = ''; });
      return;
    }
    if (layout === 'row') { stage.style.gridTemplateColumns = `repeat(${n},1fr)`; stage.style.gridTemplateRows = '1fr'; }
    else if (layout === 'col') { stage.style.gridTemplateColumns = '1fr'; stage.style.gridTemplateRows = `repeat(${n},1fr)`; }
    else if (layout === 'main' && n >= 2) { stage.style.gridTemplateColumns = '3fr 1fr'; stage.style.gridTemplateRows = `repeat(${n - 1},1fr)`; }
    else {
      const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
      const chrome = 37 + (showCmt ? 33 : 0);   // 各枠のヘッダ(+コメント欄)の高さ
      let best = 1, bestScore = Infinity;
      for (let c = 1; c <= n; c++) {
        const r = Math.ceil(n / c);
        const score = Math.abs(Math.log(((w / c) / Math.max(40, h / r - chrome)) / (16 / 9))) + (c * r - n) * 0.05;
        if (score < bestScore) { bestScore = score; best = c; }
      }
      stage.style.gridTemplateColumns = `repeat(${best},1fr)`;
      stage.style.gridTemplateRows = `repeat(${Math.ceil(n / best)},1fr)`;
    }
    [...stage.children].forEach((t, i) => {
      if (layout === 'main' && n >= 2) {
        t.style.gridColumn = i === 0 ? '1' : '2';
        t.style.gridRow = i === 0 ? `1 / span ${n - 1}` : String(i);
      } else { t.style.gridColumn = t.style.gridRow = ''; }
    });
  }

  // 各枠の「映像エリア」の位置をメインプロセスへ送り、ネイティブのビューを重ねる
  function sendRects() {
    const rects = [...stage.children].map(t => {
      const r = t.querySelector('.content').getBoundingClientRect();
      return { id: t.dataset.id, x: r.left, y: r.top, w: r.width, h: r.height };
    });
    window.mv.sync(rects, audioIds, playerOnly, volumes, hideCmts);
    window.mv.giftTargets(items.map(id => ({ id, name: nameOf(id) })));
  }
  let raf = 0;
  function layoutNow() { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { applyGrid(); sendRects(); }); }

  /* ---------- コメント送信 ---------- */
  async function sendComment(id, input, btn) {
    const text = input.value.trim();
    if (!text) return;
    input.disabled = btn.disabled = true;
    let r;
    try { r = await window.mv.comment(id, text, use184); } catch { r = { ok: false, error: '送信に失敗しました' }; }
    input.disabled = btn.disabled = !loggedIn;
    if (r && r.ok) { input.value = ''; }   // 成功時はメッセージを出さない
    else say(`${nameOf(id)}: ${(r && r.error) || '送信できませんでした'}`, true);
    if (loggedIn) input.focus();
  }

  /* ---------- 枠 ---------- */
  function makeTile(id) {
    const t = document.createElement('div');
    t.className = 'tile'; t.dataset.id = id;
    const head = document.createElement('div'); head.className = 'head';
    head.addEventListener('dblclick', e => { if (!e.target.closest('button, input')) toggleFocus(id); });
    const tag = document.createElement('span'); tag.className = 'tag';
    const vol = document.createElement('input'); vol.type = 'range'; vol.className = 'vol'; vol.min = 0; vol.max = 100; vol.step = 1;
    const volv = document.createElement('span'); volv.className = 'volv';
    const shown = () => Math.round((typeof volumes[id] === 'number' ? volumes[id] : lastVol) * 100);
    vol.value = shown(); volv.textContent = vol.value + '%'; vol.title = 'この枠の音量(音声ONの枠で聞こえます)';
    vol.addEventListener('input', () => {
      volumes[id] = lastVol = Number(vol.value) / 100; volv.textContent = vol.value + '%';
      persist(); layoutNow();
    });
    const grow = document.createElement('span'); grow.className = 'grow';
    const mk = (label, title, fn, cls) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.title = title;
      if (cls) b.className = cls; b.addEventListener('click', fn); return b;
    };

      evTrack = { key: s.evTrack.key, title: String(s.evTrack.title || '').slice(0, 100), n: Math.min(12, Math.max(1, Number(s.evTrack.n) || 4)) };
      evN = evTrack.n; evTimer = setInterval(() => refreshTop(false), 10000);
    }
    render(); renderChip();
    if (evTrack) refreshTop(true);
  });
})();
</script>
