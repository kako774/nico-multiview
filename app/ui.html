<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src https://*.nicovideo.jp https://*.nimg.jp">
<title>ニコ生マルチビュー</title>
<style>
:root{
  --bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--text:#e8eaf0;--sub:#9aa3b2;--accent:#4da3ff;--danger:#ff6b6b;--ok:#5fd38d;
  --input:#0c0e12;--btn:#232834;--btnhv:#44507a;--onaccent:#06121f;--tilebg:#05070a;--stagebg:#000;--tagbg:#000a;
  --hl:#1d3a5c;--dragbg:#0b0e14;--dragon:#14263d;--chip:#161a22;--hover:#ffffff0a;--rowline:#ffffff08;
  --c0:#4da3ff;--c1:#ff8a5c;--c2:#5fd38d;--c3:#e0b341;--c4:#c78bff;--c5:#ff6fa8;--c6:#4fd1d9;--c7:#a3b86c;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6fa;--panel:#ffffff;--line:#d3d9e3;--text:#1a1f2b;--sub:#5b6577;--accent:#1a73e8;--danger:#d93025;--ok:#188038;
    --input:#ffffff;--btn:#eef1f6;--btnhv:#9db4dc;--onaccent:#ffffff;--tilebg:#dfe4ec;--stagebg:#e6eaf1;--tagbg:#ffffffd9;
    --hl:#cfe0fb;--dragbg:#e3e8f0;--dragon:#cfe0fb;--chip:#f0f3f8;--hover:#0000000a;--rowline:#00000010;
    --c0:#1a73e8;--c1:#d9531e;--c2:#188038;--c3:#9a6b00;--c4:#8a3ffc;--c5:#c2185b;--c6:#00838f;--c7:#5d6f1f;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Noto Sans JP","Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;font-size:14px}
body{display:flex;flex-direction:column;overflow:hidden;user-select:none}
#bar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
#addForm{position:relative;display:flex;gap:6px;flex:1 1 200px;min-width:150px;max-width:420px}
input[type=text]{min-width:0;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--input);color:var(--text);font:inherit;user-select:text}
input[type=text]:focus{outline:2px solid var(--accent)}
input[type=text]:disabled{opacity:.55}
#addInput{flex:1}
.sgmsg{padding:14px;color:var(--sub);text-align:center;font-size:13px}
button,select{font:inherit;font-size:13px;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
button:hover:not(:disabled),select:hover{border-color:var(--btnhv)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:700}
.chk{display:flex;align-items:center;gap:5px;color:var(--sub);cursor:pointer;white-space:nowrap}
#setBtn{margin-left:auto}
/* ヘッダーが2行にならないよう、狭いときは順に省略する */
@media (max-width:1420px){#bar .t{display:none}}
@media (max-width:1180px){#bar .chk span.lb{display:none}}
#setPanel{display:none}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.srow+.srow{border-top:1px solid var(--line)}
.srow label{color:var(--text)}
.srow.ver{justify-content:flex-end;font-size:12px;color:var(--sub)}
#authState{font-size:12px;color:var(--sub);white-space:nowrap}
#authState.in{color:var(--ok)}
#evBtn.on{background:var(--btnhv)}
#evChip{display:none;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:12px;max-width:300px}
#evChip.show{display:inline-flex}#evChip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evi{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.evi:hover,.evi.on{background:var(--hl)}
.evi .k{font-size:11px;color:var(--sub)}
.evi .t{flex:1;min-width:0;font-weight:700;font-size:13px}
.rk{font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;background:#e8b923;color:#222;margin-right:5px}
.rk{background:#8aa4d6;color:#10203a}
.rk.r1{background:linear-gradient(135deg,#ffe27a,#e0a800);color:#3a2a00}
.rk.r2{background:linear-gradient(135deg,#f1f4f8,#aab3bf);color:#2a313b}
.rk.r3{background:linear-gradient(135deg,#e8a56a,#b0662a);color:#2e1604}
.sm{display:inline-flex;gap:3px;margin-left:5px;vertical-align:middle}
.sm i{font-style:normal;font-size:10px;font-weight:800;padding:0 3px;border-radius:5px;color:#fff}
.sm{margin-left:3px;gap:2px}
body.nosm .sm{display:none!important}
.head button.live{font-weight:800;font-size:13px;letter-spacing:.03em;color:#fff;background:#d93025;border-color:#d93025}
.head button.live:hover{filter:brightness(1.1)}
.tile.rkd .tag{flex:0 1 auto;min-width:8em}.tile.rkd .tag .tt{min-width:2em}
.tile{container-type:inline-size}
@container (max-width:620px){.head .vol,.head .volv{display:none}}
@container (max-width:460px){.head button.rw,.head .grow{display:none}}
.sm .n{background:#8e57d9}.sm .k{background:#e8782a}.sm .g{background:linear-gradient(90deg,#e0457b,#e8b923,#3fb6d9)}
.sm i.z{opacity:.35}
.tag{display:inline-flex;align-items:center;min-width:0}.tag .tt{overflow:hidden;text-overflow:ellipsis}.tag .rk,.tag .sm{flex:none}
.tile.g1{border-color:#e0a800;box-shadow:inset 0 0 0 1px #e0a800}
.tile.g2{border-color:#aab3bf;box-shadow:inset 0 0 0 1px #aab3bf}
.tile.g3{border-color:#b0662a;box-shadow:inset 0 0 0 1px #b0662a}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.row2 input[type=text]{flex:1;min-width:180px}
#msg{font-size:14px;font-weight:700;line-height:1.5;color:var(--text);width:100%;box-sizing:border-box;display:none;padding:8px 12px 8px 36px;border-radius:8px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel));position:relative}
#msg::before{content:'ℹ';position:absolute;left:11px;top:8px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;line-height:18px;text-align:center}
#msg.show{display:block}
#msg.err{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 16%,var(--panel))}
#msg.err::before{content:'!';background:var(--danger)}
body.fs #bar,body.clean #bar{display:none}
#main{flex:1 1 auto;min-height:0;display:flex}
#wrap{position:relative;flex:1 1 0;min-width:0;min-height:0;background:var(--stagebg)}
#split{flex:0 0 7px;cursor:col-resize;background:var(--line);display:none}
#split:hover,#split.drag{background:var(--accent)}
#dock{flex:0 0 auto;width:420px;display:none;background:var(--panel)}
body.docked #split,body.docked #dock{display:block}
body.fs #split,body.fs #dock,body.clean #split,body.clean #dock{display:none}
#stage{position:absolute;inset:0;display:grid;gap:4px;padding:4px}
.tile{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--line);border-radius:4px;background:var(--tilebg);overflow:hidden}
.tile.dragover{outline:3px solid var(--accent);outline-offset:-3px}
.tile.dragover .head{background:var(--hl)}
.tile.dragsrc{opacity:.5}
.head{user-select:none}
/* ドラッグ中: 隠れた映像の代わりに、放送者名を大きく出してドロップ先にする */
body.dragmode .content{display:flex;align-items:center;justify-content:center;font-size:clamp(14px,2.2vw,30px);font-weight:700;
  color:var(--sub);text-align:center;padding:12px;background:var(--dragbg)}
body.dragmode .content::after{content:attr(data-label);word-break:break-all}
body.dragmode .tile.dragover .content{color:var(--text);background:var(--dragon)}
body.dragmode .tile.dragsrc .content::after{content:attr(data-label) "\A(移動中)";white-space:pre}
.head{flex:0 0 36px;overflow:hidden;font-size:15px;display:flex;gap:5px;align-items:center;padding:0 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.head button.cm.off{opacity:.55;text-decoration:line-through}
.vol{width:110px;height:14px;accent-color:var(--accent);cursor:pointer;flex:0 1 110px;min-width:28px;margin:0 2px}
.volv{font-size:11px;color:var(--sub);min-width:3em;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
.tag{font-size:14px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--tagbg);cursor:grab;
  min-width:3.6em;max-width:none;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .grow{flex:1;min-width:0}
.head button.shot{display:inline-flex;align-items:center;justify-content:center;min-height:29px}
.head button.shot svg{width:16px;height:16px;display:block;flex:none}
.head button{flex:0 0 auto;padding:4px 9px;font-size:15px;border-radius:5px;white-space:nowrap}
.head button.on{border-color:var(--accent);color:var(--accent)}
.head button.close:hover{border-color:var(--danger);color:var(--danger)}
/* 枠のボタンは、すべて同じ大きさにそろえる(LIVEだけ横長) */
.head button{box-sizing:border-box;height:30px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.head button:not(.live){width:34px;padding:0}
.head button.live{padding:0 10px}
.content{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.content::before{content:'読み込み中…';color:var(--sub);font-size:15px}
body.dragmode .content::before{display:none}
.foot{flex:0 0 32px;display:none;gap:4px;align-items:center;padding:3px 4px;background:var(--panel);border-top:1px solid var(--line)}
body.showCmt .foot{display:flex}
.foot input{flex:1;padding:3px 8px;font-size:13px;border-radius:6px}
.foot button{padding:2px 10px;font-size:12px;border-radius:6px}
#empty{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--sub);padding:24px;line-height:1.9}
#empty.show{display:grid}
#empty b{color:var(--text);font-size:17px}
#empty code{background:var(--btn);padding:1px 6px;border-radius:4px}

/* ガラステーマ3種: B=Windows 11風(ダーク) / C=明るいフロスト / F=スモーク。Windows 11 では窓の背景もすりガラスになる */
/* B  Windows 11 風(Acrylic/Mica・ダーク) */
:root[data-theme="glassb"]{--bg:transparent;--panel:rgba(32,34,46,.55);--line:rgba(255,255,255,.12);--text:#f3f4f8;--sub:#aab0c4;--accent:#7fb2ff;--input:rgba(0,0,0,.28);
--btn:rgba(255,255,255,.08);--btnhv:#7fb2ff;--onaccent:#08142b;--tilebg:rgba(255,255,255,.04);--stagebg:transparent;--tagbg:rgba(0,0,0,.45);--hl:rgba(127,178,255,.3);color-scheme:dark}
:root[data-theme="glassb"] #bar,:root[data-theme="glassb"] .head,:root[data-theme="glassb"] .foot{backdrop-filter:blur(30px) saturate(1.6)}
:root[data-theme="glassb"] button,:root[data-theme="glassb"] select{border-color:rgba(255,255,255,.14)!important;border-radius:6px!important}
:root[data-theme="glassb"] .tile{border-color:rgba(255,255,255,.1);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
:root[data-theme="glassb"]:not(.acrylic){background:radial-gradient(700px 420px at 15% 15%,#5b3fd0 0,transparent 60%),radial-gradient(700px 500px at 90% 20%,#1e88e5 0,transparent 60%),radial-gradient(700px 400px at 50% 110%,#e0457b 0,transparent 60%),linear-gradient(160deg,#10142a,#1b2145)}
/* C  macOS風(明るいフロスト) */
:root[data-theme="glassc"]{--bg:transparent;--panel:rgba(255,255,255,.55);--line:rgba(0,0,0,.1);--text:#1c1f26;--sub:#5d6475;--accent:#0a84ff;--input:rgba(255,255,255,.7);
--btn:rgba(255,255,255,.75);--btnhv:#0a84ff;--onaccent:#fff;--tilebg:rgba(255,255,255,.35);--stagebg:transparent;--tagbg:rgba(255,255,255,.75);--hl:rgba(10,132,255,.2);color-scheme:light}
:root[data-theme="glassc"] #bar,:root[data-theme="glassc"] .head,:root[data-theme="glassc"] .foot{backdrop-filter:blur(28px) saturate(1.8)}
:root[data-theme="glassc"] button,:root[data-theme="glassc"] select{border-radius:8px!important;box-shadow:0 1px 2px rgba(0,0,0,.12)}
:root[data-theme="glassc"] .tile{border-radius:12px;border-color:rgba(255,255,255,.8);box-shadow:0 6px 20px rgba(60,70,100,.18)}
:root[data-theme="glassc"]:not(.acrylic){background:radial-gradient(700px 420px at 15% 10%,#ffd1a6 0,transparent 60%),radial-gradient(700px 500px at 90% 20%,#a6c8ff 0,transparent 60%),radial-gradient(700px 400px at 50% 110%,#c8f0d0 0,transparent 60%),linear-gradient(160deg,#e9edf6,#f6e9ef)}
/* F  スモークガラス(黒く落ち着いた半透明) */
:root[data-theme="glassf"]{--bg:transparent;--panel:rgba(8,8,12,.62);--line:rgba(255,255,255,.1);--text:#ececf2;--sub:#9a9cab;--accent:#8ab4ff;--input:rgba(255,255,255,.07);
--btn:rgba(255,255,255,.06);--btnhv:#8ab4ff;--onaccent:#071228;--tilebg:rgba(0,0,0,.25);--stagebg:transparent;--tagbg:rgba(0,0,0,.6);--hl:rgba(138,180,255,.25);color-scheme:dark}
:root[data-theme="glassf"] #bar,:root[data-theme="glassf"] .head,:root[data-theme="glassf"] .foot{backdrop-filter:blur(8px)}
:root[data-theme="glassf"] button,:root[data-theme="glassf"] select{border-color:rgba(255,255,255,.1)!important}
:root[data-theme="glassf"] .tile{border-color:rgba(255,255,255,.08)}
:root[data-theme="glassf"]:not(.acrylic){background:radial-gradient(700px 420px at 15% 15%,#5b3fd0 0,transparent 60%),radial-gradient(700px 500px at 90% 20%,#1e88e5 0,transparent 60%),radial-gradient(700px 400px at 50% 110%,#e0457b 0,transparent 60%),linear-gradient(160deg,#10142a,#1b2145)}

/* 選択肢の一覧は、背景が透けないよう、はっきりした色にする */
:root[data-theme="glassb"] option{background:#232638;color:#f3f4f8}
:root[data-theme="glassf"] option{background:#14141b;color:#ececf2}
:root[data-theme="glassc"] option{background:#ffffff;color:#1c1f26}
</style>
</head>
<body class="showCmt">
<div id="bar">
  <form id="addForm" autocomplete="off">
    <input id="addInput" type="text" placeholder="放送者名で検索 / lv番号 / 放送URL(複数まとめて貼付OK)" aria-label="放送を追加">
    <button class="primary" type="submit">追加</button>
  </form>
  <select id="layout" aria-label="配置">
    <option value="auto">自動グリッド</option>
    <option value="main">メイン + サブ</option>
    <option value="row">横一列</option>
    <option value="col">縦一列</option>
  </select>
  <label class="chk" title="各枠の下にコメント入力欄を出します"><input id="showCmt" type="checkbox" checked>コメント欄</label>
  <label class="chk" title="184(投稿者を表示しない)でコメントします"><input id="use184" type="checkbox">184</label>
  <button id="muteAll" type="button" title="全枠の音声を一括でOFF / ON">全て消音</button>
  <button id="cleanBtn" type="button" title="検索窓・ボタン・音量・コメント欄を隠して、映像の枠だけを表示します(F10)。画面の一番上にカーソルを持っていくと戻るボタンが出ます">枠のみ</button>
  <button id="fsBtn" type="button" title="全画面(F11)。上のバーを隠して、枠だけを全画面で表示します。Escで戻ります">⛶<span class="t"> 全画面</span></button>
  <button id="ppBtn" type="button" title="いま開いている枠を保存/呼び出し">📁<span class="t"> 枠の保存</span></button>
  <button id="flBtn" type="button" title="フォロー中で、いま放送中の番組を一覧から開く">👥<span class="t"> フォロー中</span></button>
  <button id="evBtn" type="button" title="ギフトイベントの上位者の放送を自動で並べる">🎁<span class="t"> ギフトイベント</span></button>
  <div id="evChip"><span id="evChipT"></span><button id="evStop" type="button" title="追跡をやめる(枠はそのまま残ります)">✕</button></div>
  <button id="viewerBtn" type="button" title="全枠のコメントをまとめて表示する別窓を開く">コメビュ</button>
  <button id="clearBtn" type="button">全部閉じる</button>
  <button id="setBtn" type="button" title="テーマ・プレイヤーのみ・ログイン">⚙<span class="t"> 設定</span></button>
  <div id="msg" role="status"></div>
</div>
<div id="setPanel" hidden>
  <div class="srow"><label for="theme">テーマ</label>
    <select id="theme" aria-label="テーマ" title="画面の明るさ">
      <option value="system">自動</option><option value="light">ライト</option><option value="dark">ダーク</option><option value="glassb">ガラス(Windows 11風)</option><option value="glassc">ガラス(明るい)</option><option value="glassf">ガラス(スモーク)</option>
    </select></div>
  <div class="srow"><label for="playerOnly">プレイヤーのみ</label>
    <input id="playerOnly" type="checkbox" checked title="OFFにすると視聴ページ全体を表示します"></div>
  <div class="srow"><span id="authState">未ログイン</span><button id="authBtn" type="button">ニコニコにログイン</button></div>
  <div class="srow ver"><span id="verText">バージョン</span></div>
</div>
<div id="main">
<div id="wrap">
  <div id="stage"></div>
  <div id="empty" class="show">
    <div><b>見たい放送を追加してください</b><br>
    上の入力欄に <code>lv123456789</code> または放送ページのURLを貼って「追加」<br>
    複数まとめて貼ると一度に並びます(最大12枠)。音声は「🔊」を押した1枠だけ出ます<br>
    コメントするには、右上の「ニコニコにログイン」からログインしてください</div>
  </div>
</div>
<div id="split" title="ドラッグで幅を変える"></div>
<div id="dock"></div>
</div>

<script>
(() => {
  'use strict';
  const MAX = 12;
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), emptyEl = $('#empty'), msg = $('#msg'), layoutSel = $('#layout');
  let items = [], layout = 'auto', audioIds = [];   // 音声ONの枠(複数可)
  let playerOnly = true, showCmt = true, use184 = false, loggedIn = false, loginVia = '', audioOnAdd = true, hideSrcName = false, viewerSimple = false, alwaysTop = false, evAudioAll = false, shotDir = '', singleOpen = false, seekOn = true, showSm = true;
  let theme = 'system';
  let hideCmts = {};   // 枠ごとの「流れるコメントを隠す」
  let volumes = {}, lastVol = 0.5;   // 枠ごとの音量(0〜1)と、最後に動かした音量(新しい枠の初期値)
  let presets = [];   // 保存した枠 { name, items }
  let evTrack = null, evKeys = [];   // 追跡中のイベント { key, title, n } / 手入力したイベントのキー
  let evSig = null, evTimer = 0, evBusy = false, evGen = 0;   // evGen: 追跡を切り替えたときに、古い取得結果を捨てるための番号
  const ranks = new Map();   // lv番号 -> { rank, score }
  let evLvs = [];            // 自動で管理している枠
  const infos = new Map();   // lv番号 -> { name: 放送者名, title: 番組名 }

  const parseIds = t => [...new Set((String(t || '').match(/lv\d+/gi) || []).map(s => s.toLowerCase()))];
  const persist = () => window.mv.save({ items, layout, audioIds, playerOnly, showCmt, use184, audioOnAdd, evAudioAll, singleOpen, seekOn, showSm, shotDir, hideSrcName, viewerSimple, alwaysTop, volumes, lastVol, hideCmts, theme, evTrack, evKeys, presets });
  // 表示名: 放送者名(取得できるまではlv番号)
  const shotDirDef = '(ピクチャ\\ニコ生マルチビュー)';
  const nameOf = id => (infos.get(id) && infos.get(id).name) || id;

  let msgTimer;
  function say(text, err) {
    // 画面の下にポップアップで出す(上のバーに出すと、枠の大きさが変わってしまうため)
    window.mv.toast(text, err);
  }

  /* ---------- ログイン表示 ---------- */
  function renderAuth() {
    $('#authState').textContent = loggedIn ? 'ログイン中' + (loginVia ? ' (' + loginVia + ')' : '') : '未ログイン';
    $('#authState').className = loggedIn ? 'in' : '';
    $('#authBtn').textContent = loggedIn ? 'ログアウト' : 'ニコニコにログイン';
    if (menuType === 'set') window.mv.menuData(menuData());
    document.querySelectorAll('.tile').forEach(t => applyFoot(t.dataset.id));
  }
  // 投稿欄: 未ログイン、またはその枠がコメント不可(タイムシフトなど)のときは無効にして、理由を表示する
  const cstate = new Map();   // 枠 -> コメントできない理由(できるときは空)
  function applyFoot(id) {
    const t = [...document.querySelectorAll('.tile')].find(x => x.dataset.id === id); if (!t) return;
    const f = t.querySelector('.foot'); if (!f) return;
    const i = f.querySelector('input'), b = f.querySelector('button'), why = cstate.get(id) || '';
    const off = !loggedIn || !!why;
    i.disabled = b.disabled = off;
    if (off && why) i.value = '';
    i.placeholder = !loggedIn ? 'ログインするとコメントできます' : (why || 'コメントを入力(Enterで送信)');
    i.title = off ? i.placeholder : '';
  }
  window.mv.onNotice((id, text) => say(`${nameOf(id)}: ${text}`, true));
  window.mv.onCState((id, why) => { cstate.set(id, why); applyFoot(id); });

  /* ---------- ラベル(放送者名) ---------- */
  function updateTags() {
    [...stage.children].forEach((t, i) => {
      const id = t.dataset.id, info = infos.get(id);
      const tag = t.querySelector('.tag');
      const rk = ranks.get(id);
      tag.textContent = '';
      if (rk) { const b = document.createElement('span'); b.className = 'rk r' + rk.rank; b.textContent = (rk.rank <= 3 ? ['🥇', '🥈', '🥉'][rk.rank - 1] + ' ' : '') + rk.rank + '位'; tag.appendChild(b); }
      const tt = document.createElement('span'); tt.className = 'tt';
      tt.textContent = (layout === 'main' && i === 0 ? '★ ' : '') + nameOf(id) + (rk ? ` ${rk.score.toLocaleString('ja-JP')}pt` : '');
      tag.appendChild(tt);
      if (rk && rk.sm) {
        const w = document.createElement('span'); w.className = 'sm'; w.title = '召喚獣の数(通常 / 改 / 神)';
        [['n', '召', rk.sm.normal], ['k', '改', rk.sm.kai], ['g', '神', rk.sm.god]].forEach(([c, l, v]) => { const e = document.createElement('i'); e.className = c + (v ? '' : ' z'); e.textContent = `${l}${v}`; e.title = ({ n: '召喚獣', k: '召喚獣 改', g: '召喚獣 神' })[c] + ` ${v}個`; w.appendChild(e); });
        tag.appendChild(w);
      }
      t.classList.toggle('rkd', !!rk); t.classList.remove('g1', 'g2', 'g3'); if (rk && rk.rank <= 3) t.classList.add('g' + rk.rank);
      tag.title = nameOf(id) + '\n' + (info && info.title ? `${info.title}\n` : '') + id + '\nドラッグで並べ替え';
    });
  }

  /* ---------- 配置 ---------- */
  // ダブルクリックでその枠だけを表示(もう一度ダブルクリック / Escで元に戻る)
  let focusId = '';
  let cleanMode = false;   // 「枠のみ」表示(上の操作バーだけ隠す)。保存はしない
  function setClean(on) {
    cleanMode = !!on; document.body.classList.toggle('clean', cleanMode);
    $('#cleanBtn').classList.toggle('on', cleanMode); window.mv.cleanState(cleanMode);
    layoutNow(); setTimeout(layoutNow, 150);
  }
  function toggleFocus(id) {
    if (focusId === id) { focusId = ''; say('元の表示に戻しました'); }
    else if (items.includes(id)) { focusId = id; say(`${nameOf(id)} だけを表示中(もう一度ダブルクリックかEscで戻る)`); }
    render();
  }
  function applyGrid() {
    const n = items.length;
    stage.style.gridTemplateColumns = stage.style.gridTemplateRows = '';
    if (focusId && !items.includes(focusId)) focusId = '';
    [...stage.children].forEach(t => { t.style.display = focusId && t.dataset.id !== focusId ? 'none' : ''; });
    if (!n) return;
    if (focusId) {
      stage.style.gridTemplateColumns = stage.style.gridTemplateRows = '1fr';
      [...stage.children].forEach(t => { t.style.gridColumn = t.style.gridRow = ''; });
      return;
    }
    if (layout === 'row') { stage.style.gridTemplateColumns = `repeat(${n},1fr)`; stage.style.gridTemplateRows = '1fr'; }
    else if (layout === 'col') { stage.style.gridTemplateColumns = '1fr'; stage.style.gridTemplateRows = `repeat(${n},1fr)`; }
    else if (layout === 'main' && n >= 2) { stage.style.gridTemplateColumns = '3fr 1fr'; stage.style.gridTemplateRows = `repeat(${n - 1},1fr)`; }
    else {
      const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
      const chrome = 37 + (showCmt ? 33 : 0);   // 各枠のヘッダ(+コメント欄)の高さ
      let best = 1, bestScore = Infinity;
      for (let c = 1; c <= n; c++) {
        const r = Math.ceil(n / c);
        const score = Math.abs(Math.log(((w / c) / Math.max(40, h / r - chrome)) / (16 / 9))) + (c * r - n) * 0.05;
        if (score < bestScore) { bestScore = score; best = c; }
      }
      stage.style.gridTemplateColumns = `repeat(${best},1fr)`;
      stage.style.gridTemplateRows = `repeat(${Math.ceil(n / best)},1fr)`;
    }
    [...stage.children].forEach((t, i) => {
      if (layout === 'main' && n >= 2) {
        t.style.gridColumn = i === 0 ? '1' : '2';
        t.style.gridRow = i === 0 ? `1 / span ${n - 1}` : String(i);
      } else { t.style.gridColumn = t.style.gridRow = ''; }
    });
  }

  // 各枠の「映像エリア」の位置をメインプロセスへ送り、ネイティブのビューを重ねる
  function sendRects() {
    const rects = [...stage.children].map(t => {
      const r = t.querySelector('.content').getBoundingClientRect();
      return { id: t.dataset.id, x: r.left, y: r.top, w: r.width, h: r.height };
    });
    window.mv.sync(rects, audioIds, playerOnly, volumes, hideCmts);
    sendDock();
    window.mv.giftTargets(items.map(id => ({ id, name: nameOf(id) })));
  }
  // 合体したコメビュを置く場所(右側)を、メインプロセスへ伝える
  const dockEl = $('#dock'), splitEl = $('#split');
  let dockOn = false, dockW = 420;
  function sendDock() {
    if (!dockOn || getComputedStyle(dockEl).display === 'none') { window.mv.dockRect(null); return; }
    const r = dockEl.getBoundingClientRect();
    window.mv.dockRect({ x: r.left, y: r.top, width: r.width, height: r.height });
  }
  window.mv.onDock((on, w) => {
    dockOn = !!on; if (w >= 280) dockW = w;
    dockEl.style.width = dockW + 'px';
    document.body.classList.toggle('docked', dockOn);
    layoutNow(); setTimeout(layoutNow, 120);
  });
  splitEl.addEventListener('pointerdown', ev => {
    ev.preventDefault(); splitEl.setPointerCapture(ev.pointerId); splitEl.classList.add('drag');
    const startX = ev.clientX, startW = dockW;
    const mv = e => { dockW = Math.max(280, Math.min(Math.round(window.innerWidth * 0.6), startW + (startX - e.clientX))); dockEl.style.width = dockW + 'px'; layoutNow(); };
    const up = () => { splitEl.classList.remove('drag'); splitEl.removeEventListener('pointermove', mv); splitEl.removeEventListener('pointerup', up); splitEl.removeEventListener('pointercancel', up); window.mv.dockWidth(dockW); };
    splitEl.addEventListener('pointermove', mv); splitEl.addEventListener('pointerup', up); splitEl.addEventListener('pointercancel', up);
  });
  // 1つの枠(拡大中ならその枠、なければ最初の枠)の映像エリアが tw×th になるよう、窓の大きさを合わせる
  let fitting = false;
  async function fitVideo(tw, th) {
    if (fitting) return; fitting = true;
    try {
      if (!items.length) { say('枠がありません。放送を追加してから実行してください'); return; }
      const id = focusId && items.includes(focusId) ? focusId : items[0];
      let clamped = false, r = null;
      for (let i = 0; i < 4; i++) {
        const t = [...stage.children].find(x => x.dataset.id === id);
        r = t && t.querySelector('.content').getBoundingClientRect();
        if (!r || !r.width || !r.height) break;
        const dw = tw - r.width, dh = th - r.height;
        if (Math.abs(dw) < 1 && Math.abs(dh) < 1) break;
        // 枠が複数あるときは、窓全体の変化量が枠1つ分より大きくなる分を補正する
        const res = await window.mv.resizeBy(dw * (stage.clientWidth / r.width), dh * (stage.clientHeight / r.height));
        if (!res || !res.ok) { say(res && res.why === 'fullscreen' ? '全画面を解除してから実行してください' : '窓の大きさを変えられませんでした'); return; }
        clamped = !!res.clamped;
        applyGrid(); await new Promise(f => setTimeout(f, 250));
      }
      const t = [...stage.children].find(x => x.dataset.id === id);
      r = t && t.querySelector('.content').getBoundingClientRect();
      if (r && Math.abs(r.width - tw) < 1.5 && Math.abs(r.height - th) < 1.5) say(`映像を ${tw}×${th} に合わせました`);
      else say(`映像は ${r ? Math.round(r.width) : '?'}×${r ? Math.round(r.height) : '?'} になりました` + (clamped ? '(画面に収まらないため、これ以上は広げられません)' : ''));
    } finally { fitting = false; layoutNow(); }
  }
  let raf = 0;
  function layoutNow() { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { applyGrid(); sendRects(); }); }

  /* ---------- コメント送信 ---------- */
  async function sendComment(id, input, btn) {
    const text = input.value.trim();
    if (!text) return;
    input.disabled = btn.disabled = true;
    let r;
    try { r = await window.mv.comment(id, text, use184); } catch { r = { ok: false, error: '送信に失敗しました' }; }
    applyFoot(id);
    if (r && r.ok) { input.value = ''; if (r.warn) say(`${nameOf(id)}: ${r.warn}`, true); }   // 成功時は、通常メッセージを出さない
    else say(`${nameOf(id)}: ${(r && r.error) || '送信できませんでした'}`, true);
    if (loggedIn) input.focus();
  }

  /* ---------- 枠 ---------- */
  function makeTile(id) {
    const t = document.createElement('div');
    t.className = 'tile'; t.dataset.id = id;
    const head = document.createElement('div'); head.className = 'head';
    head.addEventListener('dblclick', e => { if (!e.target.closest('button, input')) toggleFocus(id); });
    const tag = document.createElement('span'); tag.className = 'tag';
    tag.title = '右クリック: 放送の詳細 / 放送のURLをコピー / 放送者のページ';
    tag.addEventListener('contextmenu', e => { e.preventDefault(); fmTarget = id; openMenu('fm', tag); });
    const vol = document.createElement('input'); vol.type = 'range'; vol.className = 'vol'; vol.min = 0; vol.max = 100; vol.step = 1;
    const volv = document.createElement('span'); volv.className = 'volv';
    const shown = () => Math.round((typeof volumes[id] === 'number' ? volumes[id] : lastVol) * 100);
    vol.value = shown(); volv.textContent = vol.value + '%'; vol.title = 'この枠の音量(音声ONの枠で聞こえます)';
    vol.addEventListener('input', () => {
      volumes[id] = lastVol = Number(vol.value) / 100; volv.textContent = vol.value + '%';
      persist(); layoutNow();
    });
    const grow = document.createElement('span'); grow.className = 'grow';
    const mk = (label, title, fn, cls) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.title = title;
      if (cls) b.className = cls; b.addEventListener('click', fn); return b;
    };
    const snd = mk('🔇', 'この枠の音声のON/OFF(複数の枠を同時にONにできます)', () => { audioIds = audioIds.includes(id) ? audioIds.filter(x => x !== id) : [...audioIds, id]; render(); }, 'snd');
    const cm = mk('💬', 'この枠の、映像に流れるコメントを非表示/表示', () => {
      hideCmts[id] = !hideCmts[id]; cm.classList.toggle('off', !!hideCmts[id]); persist(); layoutNow();
    }, 'cm');
    cm.classList.toggle('off', !!hideCmts[id]);
    const rw = mk('⏪', '10秒戻す(タイムシフト・プレミアム会員)', () => window.mv.player(id, 'back'), 'rw');
    const lv = mk('LIVE', '現在のライブに戻る', () => window.mv.player(id, 'live'), 'live');
    head.append(tag, grow, vol, volv, rw, lv, snd, cm,
      mk('🎁', 'この枠にギフトを贈る(ギフトウィンドウが開きます)', () => window.mv.giftOpen(id), 'giftbtn'),
      (() => { const b = mk('', 'この枠のエモーションを開く(別窓)', () => window.mv.emotion(id), 'emo'); b.style.fontSize = '0'; b.innerHTML = '&#8203;<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.2c.9 1.3 2.1 2 3.5 2s2.6-.7 3.5-2"/><circle cx="9" cy="9.8" r=".6" fill="currentColor"/><circle cx="15" cy="9.8" r=".6" fill="currentColor"/></svg>'; return b; })(),
      mk('★', 'メインにする(この枠を先頭・大きい枠へ)', () => {
        items = [id, ...items.filter(x => x !== id)]; if (layout === 'auto') layout = 'main'; render();
      }),
      (() => { const run = async (noCmt) => {
        const r = await window.mv.shot(id, nameOf(id) || '', shotDir, noCmt).catch(e => ({ ok: false, error: '撮影に失敗しました(呼び出し: ' + String(e && e.message || e).slice(0, 60) + ')' }));
        if (!(r && r.ok)) { say((r && r.error) || '撮影に失敗しました', true); return; }
        if (r.png) {   // 本体側でコピーできなかったときは、ここでクリップボードにコピーする
          try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': new Blob([r.png], { type: 'image/png' }) })]); window.mv.log && window.mv.log('INFO', 'スクリーンショットをクリップボードにコピーしました'); }
          catch (e) { say('クリップボードにコピーできませんでした(ファイルには保存しました)', true); window.mv.log && window.mv.log('WARN', 'スクショのコピーに失敗(画面側): ' + String(e && e.message || e).slice(0, 80)); }
        }   // 成功のときは、メッセージを出さない(ログに残す)
      }; const b = mk('📷', 'この枠の映像(流れるコメントを含む)を撮る: クリップボードにコピーして、保存もします\n右クリック: コメントなしで撮る', () => run(false), 'shot'); b.addEventListener('contextmenu', e => { e.preventDefault(); run(true); }); b.innerHTML = '&#8203;<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.2" r="3.6"/></svg>'; return b; })(),
      mk('↻', '再読込(この枠だけ読み込み直す)', () => window.mv.reload(id)),
      mk('↗', 'ブラウザで開く(既定のブラウザ)', () => window.mv.external(id)),
      mk('✕', 'この枠を閉じる', () => { items = items.filter(x => x !== id); audioIds = audioIds.filter(x => x !== id); render(); }, 'close'));
    const content = document.createElement('div'); content.className = 'content';

    const foot = document.createElement('form'); foot.className = 'foot'; foot.autocomplete = 'off';
    const ci = document.createElement('input'); ci.type = 'text'; ci.maxLength = 1000;
    const cb = document.createElement('button'); cb.type = 'submit'; cb.textContent = '送信';
    foot.append(ci, cb);
    foot.addEventListener('submit', e => { e.preventDefault(); sendComment(id, ci, cb); });
    // 日本語入力の確定のEnterでは送信しない
    ci.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) e.preventDefault(); });

    t.append(head, content, foot);

    // ラベル/ヘッダの空き部分をつかんで動かすと並べ替え(5px以上動いたら開始)
    head.addEventListener('mousedown', e => {
      if (e.button !== 0 || e.target.closest('button, input')) return;
      e.preventDefault();
      const sx = e.screenX, sy = e.screenY; let started = false;
      const move = ev => {
        if (!started && Math.hypot(ev.screenX - sx, ev.screenY - sy) > 5) { started = true; window.mv.dragStart(id); }
      };
      const up = () => {
        document.removeEventListener('mousemove', move, true); document.removeEventListener('mouseup', up, true);
        if (started) window.mv.dragEnd();
      };
      document.addEventListener('mousemove', move, true); document.addEventListener('mouseup', up, true);
    });
    return t;
  }

  function render() {
    const existing = new Map([...stage.children].map(t => [t.dataset.id, t]));
    items.forEach((id, i) => {
      let t = existing.get(id);
      if (t) existing.delete(id); else t = makeTile(id);
      if (stage.children[i] !== t) stage.insertBefore(t, stage.children[i] || null);
      applyFoot(id);
      const s = t.querySelector('.snd'), on = audioIds.includes(id);
      s.textContent = on ? '🔊' : '🔇'; s.classList.toggle('on', on);
    });
    existing.forEach(t => t.remove());
    $('#muteAll').textContent = audioIds.length ? '全て消音' : '全て音声ON';
    emptyEl.classList.toggle('show', items.length === 0);
    layoutSel.value = layout;
    document.body.classList.toggle('showCmt', showCmt);
    updateTags();
    renderAuth();
    persist(); layoutNow();
  }

  function add(text, keepAll) {
    const ids = parseIds(text);
    if (!ids.length) { say('lv番号が見つかりませんでした(例: lv123456789)', true); return; }
    // 設定「追加せず1枠だけで開く」がONなら、いま並んでいる枠を閉じて、指定の放送だけを開く(フォロー中・検索・貼り付け)
    if (singleOpen && !keepAll) {
      const keep = ids.slice(0, MAX);
      if (!(keep.length === items.length && keep.every(i => items.includes(i)))) { items = []; audioIds = audioIds.filter(x => keep.includes(x)); }
    }
    let added = 0, dup = 0, over = 0;
    for (const id of ids) {
      if (items.includes(id)) { dup++; continue; }
      if (items.length >= MAX) { over++; continue; }
      items.push(id); added++;
      if (typeof volumes[id] !== 'number') volumes[id] = lastVol;
    }
    // 設定「追加したときに音声を出す」がONなら、1枠だけ追加したときその枠の音声をONにする(まとめて追加したときは全てミュートで始める)。OFFなら、いつもミュートで始める
    if (added === 1 && audioOnAdd) { const nid = items[items.length - 1]; if (!audioIds.includes(nid)) audioIds = [...audioIds, nid]; }
    render();
    const p = [];
    if (added) p.push(`${added}枠を追加しました`);
    if (dup) p.push(`${dup}枠は追加済み`);
    if (over) p.push(`${over}枠は上限(${MAX})のため追加できません`);
    say(p.join(' / '), !added);
  }

  /* ---------- イベント ---------- */
  $('#addForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#addInput').value.trim();
    if (!v) return;
    if (parseIds(v).length) { add(v); $('#addInput').value = ''; closeSug(); }
    else { clearTimeout(sgTimer); runSearch(v); }   // lv番号がなければ、放送者名などとして検索
  });

  /* ---------- 放送者名で検索 → 候補から追加 ---------- */
  const addInput = $('#addInput');
  let sgItems = [], sgIdx = -1, sgTimer = 0, sgSeq = 0, sgOpen = false, sgMsg = '';
  // 検索候補は、映像と同じネイティブのビュー(メニュー)で、いちばん手前に出す。入力欄のフォーカスはそのまま
  function sugPayload(scroll) { return Object.assign(menuData(), { sug: { msg: sgMsg, items: sgItems, idx: sgIdx, added: items.filter(id => sgItems.some(s => s.id === id)), scroll: !!scroll } }); }
  function pushSug(scroll) {
    if (!sgOpen) {
      sgOpen = true; menuType = 'sug';
      const r = $('#addForm').getBoundingClientRect();
      window.mv.menuOpen('sug', { left: r.left, bottom: r.bottom, width: Math.max(r.width, 520) }, sugPayload(scroll));
    } else window.mv.menuData(sugPayload(scroll));
  }
  function closeSug() {
    clearTimeout(sgTimer); sgSeq++; sgItems = []; sgIdx = -1; sgMsg = '';
    if (sgOpen) { sgOpen = false; if (menuType === 'sug') { menuType = ''; window.mv.menuClose(true); } }
  }
  function sugMsg(text) { sgMsg = text; sgItems = []; pushSug(); }
  function markSug(scroll) { sgMsg = ''; pushSug(scroll); }
  function renderSug() { sgMsg = ''; pushSug(); }
  function pickSug(i) {
    const it = sgItems[i]; if (!it) return;
    if (items.includes(it.id)) { say(`${it.name || it.id} は追加済みです`); return; }
    add(it.id);       // 追加後も候補は開いたままにして、続けて追加できる
    markSug();
  }
  async function runSearch(q) {
    const seq = ++sgSeq;
    sugMsg('検索中…');
    let r;
    try { r = await window.mv.search(q); } catch { r = { ok: false }; }
    if (seq !== sgSeq) return;   // 古い検索結果は捨てる
    if (!r || !r.ok) { sgItems = []; sugMsg('検索できませんでした。しばらくしてからもう一度お試しください'); return; }
    sgItems = r.items; sgIdx = sgItems.length ? 0 : -1;
    if (!sgItems.length) sugMsg('放送者名が一致する放送中の枠が見つかりませんでした'); else renderSug();
  }
  addInput.addEventListener('input', () => {
    const v = addInput.value.trim();
    clearTimeout(sgTimer);
    if (!v || parseIds(v).length || /nicovideo\.jp/i.test(v)) { closeSug(); return; }   // lv番号・URLなら検索しない
    sgTimer = setTimeout(() => runSearch(v), 350);
  });
  addInput.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;   // 日本語入力の確定中は何もしない
    if (!sgOpen) return;
    if (e.key === 'Escape') { e.preventDefault(); closeSug(); }
    else if (sgItems.length && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault(); sgIdx = (sgIdx + (e.key === 'ArrowDown' ? 1 : -1) + sgItems.length) % sgItems.length; markSug(true);
    } else if (sgItems.length && e.key === 'Enter' && sgIdx >= 0) { e.preventDefault(); pickSug(sgIdx); }
  });
  document.addEventListener('mousedown', e => { if (sgOpen && e.target !== addInput) closeSug(); });
  $('#addInput').addEventListener('paste', e => {
    const text = (e.clipboardData || window.clipboardData).getData('text');
    if (parseIds(text).length > 1) { e.preventDefault(); add(text); }
  });
  // ブラウザからリンクをドラッグして追加(枠の上=メイン側から届く / ツールバー・空き領域=ここで受ける)
  window.mv.onAdd(t => add(t));
  window.mv.onFocus(id => toggleFocus(id));
  window.mv.onUnfocus(() => { if (focusId) toggleFocus(focusId); });
  const linkDrag = e => e.dataTransfer && [...(e.dataTransfer.types || [])].some(t => /uri-list|moz-url|plain|html/.test(t));
  document.addEventListener('dragover', e => { if (linkDrag(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
  document.addEventListener('drop', e => {
    if (!linkDrag(e)) return;
    e.preventDefault();
    const dt = e.dataTransfer, t = ['text/uri-list', 'text/x-moz-url', 'text/plain', 'text/html'].map(k => { try { return dt.getData(k); } catch { return ''; } }).join('\n');
    if (parseIds(t).length) add(t); else say('放送のリンク(lv…)が見つかりませんでした', true);
  });
  layoutSel.addEventListener('change', () => { layout = layoutSel.value; render(); });
  const poEl = $('#playerOnly'), scEl = $('#showCmt'), a184 = $('#use184');
  poEl.addEventListener('change', () => { playerOnly = poEl.checked; render(); });
  scEl.addEventListener('change', () => { showCmt = scEl.checked; render(); });
  a184.addEventListener('change', () => { use184 = a184.checked; persist(); });
  $('#muteAll').addEventListener('click', () => { audioIds = audioIds.length ? [] : items.slice(); render(); });
  $('#fsBtn').addEventListener('click', () => window.mv.fullscreen());
  $('#cleanBtn').addEventListener('click', () => setClean(!cleanMode));
  window.mv.onClean(on => setClean(on));
  document.addEventListener('keydown', e => { if (e.key === 'F10') { e.preventDefault(); setClean(!cleanMode); } });
  window.mv.onFullscreen(on => { document.body.classList.toggle('fs', on); layoutNow(); setTimeout(layoutNow, 150); });
  /* ---------- 設定(メニューは、映像と同じネイティブのビューで開く。値は、見えない設定部品が持つ) ---------- */
  const setBtn = $('#setBtn');
  let appVersion = '', updateInfo = null;
  const checkUpdate = () => window.mv.updateCheck().then(r => {
    updateInfo = r && r.ok && r.newer ? { latest: r.latest, auto: !!r.auto } : null;
    setBtn.innerHTML = updateInfo ? '⚙<span class="t"> 設定</span> 🔔' : '⚙<span class="t"> 設定</span>';
    setBtn.title = updateInfo ? `新しいバージョン v${updateInfo.latest} があります` : 'テーマ・プレイヤーのみ・ログイン';
    if (menuType === 'set') window.mv.menuData(menuData());
  }).catch(() => {});
  setTimeout(checkUpdate, 3000); setInterval(checkUpdate, 6 * 3600 * 1000);
  setBtn.addEventListener('click', () => openMenu('set', setBtn));
  window.mv.version().then(v => { appVersion = v; }).catch(() => {});
  const themeSel = $('#theme');
  themeSel.addEventListener('change', () => { theme = themeSel.value; document.documentElement.dataset.theme = theme; window.mv.setTheme(theme); persist(); });
  window.mv.onGlass(ok => document.documentElement.classList.toggle('acrylic', ok));
  $('#viewerBtn').addEventListener('click', () => window.mv.openViewer());
  $('#clearBtn').addEventListener('click', () => { if (!items.length) return; if (!confirm(`開いている ${items.length} 枠をすべて閉じますか?`)) return; items = []; audioIds = []; render(); });
  $('#authBtn').addEventListener('click', () => {
    if (loggedIn) { if (confirm('ニコニコからログアウトしますか?')) window.mv.logout(); }
    else { window.mv.login(); say('入れないときは、設定の「ブラウザでログイン」を使えます'); }
  });
  window.mv.onBrowserLogin(r => { if (r && !r.ok && r.error) say(r.error); });
  window.mv.onAuth((v, via) => {
    const was = loggedIn; loggedIn = v; loginVia = v ? (via || '') : ''; renderAuth();
    if (v && !was) say('ログインしました');
    if (!v && was) say('ログアウトしました');
  });
  // 各枠のページから取得した放送者名・番組名を受け取ってラベルに反映
  window.mv.onInfo((id, info) => {
    if (!info || !info.name) return;
    infos.set(id, { name: String(info.name), title: String(info.title || '') });
    updateTags();
  });

  /* ---------- 枠のドラッグ並べ替え(位置の判定はメイン側から届く) ---------- */
  let dragSrc = null, dragOver = null;
  const tileAt = (x, y) => [...stage.children].find(t => {
    const r = t.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  });
  function markOver(t) {
    const id = t && t.dataset.id !== dragSrc ? t.dataset.id : null;
    if (id === dragOver) return;
    dragOver = id;
    stage.querySelectorAll('.tile').forEach(x => x.classList.toggle('dragover', x.dataset.id === id));
  }
  window.mv.onDrag(d => {
    if (d.type === 'start') {
      dragSrc = d.id; dragOver = null;
      document.body.classList.add('dragmode');
      stage.querySelectorAll('.tile').forEach(t => {
        t.querySelector('.content').dataset.label = nameOf(t.dataset.id);
        t.classList.toggle('dragsrc', t.dataset.id === dragSrc);
      });
    } else if (d.type === 'pos') {
      if (dragSrc) markOver(tileAt(d.x, d.y));
    } else if (d.type === 'end') {
      if (!dragSrc) return;
      const target = tileAt(d.x, d.y), to = target && target.dataset.id;
      const src = dragSrc; dragSrc = null; dragOver = null;
      document.body.classList.remove('dragmode');
      stage.querySelectorAll('.tile').forEach(t => t.classList.remove('dragover', 'dragsrc'));
      if (to && to !== src && items.includes(src) && items.includes(to)) {
        const next = items.filter(x => x !== src); next.splice(items.indexOf(to), 0, src); items = next;
        render();
      } else layoutNow();
    }
  });
  // 万一マウスを離した通知が届かなかった場合は、動かした時点で終了させる
  document.addEventListener('mousemove', e => { if (dragSrc && e.buttons === 0) window.mv.dragEnd(); }, true);
  new ResizeObserver(layoutNow).observe(stage);
  addEventListener('resize', layoutNow);

  /* ---------- ギフトイベント: 上位者を自動表示 ---------- */
  const evBtn = $('#evBtn');
  const keyOf = t => { const m = String(t || '').match(/auditions\/([\w-]{1,80})/) || String(t || '').trim().match(/^([\w-]{1,80})$/); return m ? m[1] : ''; };
  let evN = 4, menuType = '', pendingEv = null;
  function savePreset(name) {
    name = String(name || '').trim().slice(0, 40) || `保存 ${new Date().toLocaleString('ja-JP')}`;
    presets = [{ name, items: [...items] }, ...presets.filter(p => p.name !== name)].slice(0, 30);
    persist(); return name;
  }
  // メニュー(映像と同じネイティブのビューで、いちばん手前に出る)
  function menuData() {
    const names = {}; presets.forEach(p => p.items.forEach(id => { names[id] = nameOf(id); })); items.forEach(id => { names[id] = nameOf(id); });
    return { fmId: fmTarget, fmName: nameOf(fmTarget), theme, playerOnly, audioOnAdd, evAudioAll, singleOpen, seekOn, showSm, shotDir, shotDirDef: shotDirDef, hideSrcName, viewerSimple, alwaysTop, loggedIn, loginVia, appVersion, update: updateInfo, presets, names, evKeys, evTrack, evN, items: items.slice(), dlgCount: items.length, dlgNames: items.map(nameOf) };
  }
  let fmTarget = '';
  function openMenu(type, btn) {
    const r = btn.getBoundingClientRect();
    if (type === 'set') {   // 設定は、ボタンの右端にそろえて開く
      if (sgOpen) { sgOpen = false; clearTimeout(sgTimer); sgSeq++; }
      menuType = type;
      window.mv.menuOpen(type, { left: r.right - 300, bottom: r.bottom, width: 300 }, menuData());
      return;
    }
    if (sgOpen) { sgOpen = false; clearTimeout(sgTimer); sgSeq++; }
    menuType = type;
    window.mv.menuOpen(type, { left: r.left, bottom: r.bottom }, menuData());
  }
  document.addEventListener('mousedown', e => { if (menuType && menuType !== 'sug' && !e.target.closest('#evBtn, #flBtn, #ppBtn, #setBtn')) window.mv.menuClose(); }, true);
  window.mv.onMenuClosed(t => { if (menuType === t) menuType = ''; if (t === 'sug') sgOpen = false; });
  window.mv.onMenuAct((action, p) => {
    if (action === 'set-theme') { themeSel.value = String(p); themeSel.dispatchEvent(new Event('change')); window.mv.menuData(menuData()); return; }
    if (action === 'fm-detail' || action === 'fm-url' || action === 'fm-user') {
      window.mv.frameAct(action.slice(3), String(p)).then(r => { if (r && r.ok === false && r.error) say(r.error, true); });
      return;
    }
    if (action === 'set-fit720') { fitVideo(1280, 720); return; }
    if (action === 'set-top') { alwaysTop = !!p; window.mv.alwaysTop(alwaysTop); persist(); window.mv.menuData(menuData()); return; }
    if (action === 'set-vsimple') { viewerSimple = !!p; window.mv.viewerOpt({ hideSrc: hideSrcName, simple: viewerSimple }); persist(); window.mv.menuData(menuData()); return; }
    if (action === 'set-hsn') { hideSrcName = !p; window.mv.viewerOpt({ hideSrc: hideSrcName, simple: viewerSimple }); persist(); window.mv.menuData(menuData()); return; }
    if (action === 'set-shotdir') { window.mv.pickShotDir(shotDir).then(r => { if (r && r.dir) { shotDir = r.dir; persist(); } window.mv.menuData(menuData()); }); return; }
    if (action === 'set-shotdir-reset') { shotDir = ''; persist(); window.mv.menuData(menuData()); return; }
    if (action === 'set-shotdir-open') { window.mv.openShotDir(shotDir); return; }
    if (action === 'set-sm') { showSm = !!p; document.body.classList.toggle('nosm', !showSm); persist(); window.mv.menuData(menuData()); return; }
    if (action === 'set-seek') { seekOn = !!p; window.mv.seek(seekOn); persist(); window.mv.menuData(menuData()); return; }
    if (action === 'set-so') { singleOpen = !!p; persist(); window.mv.menuData(menuData()); return; }
    if (action === 'set-eaa') { evAudioAll = !!p; persist(); window.mv.menuData(menuData()); return; }
    if (action === 'set-aoa') { audioOnAdd = !!p; persist(); window.mv.menuData(menuData()); return; }
    if (action === 'set-po') { poEl.checked = !!p; poEl.dispatchEvent(new Event('change')); window.mv.menuData(menuData()); return; }
    if (action === 'set-about') { window.mv.about(); return; }
    if (action === 'set-log') { window.mv.logOpen(); return; }
    if (action === 'set-update') { window.mv.openRelease(); return; }
    if (action === 'set-update-apply') {
      say('更新をダウンロードしています…');
      window.mv.updateApply().then(r => { if (r && r.ok) say('更新して、再起動します'); else say((r && r.error) || '更新できませんでした', true); }).catch(() => say('更新できませんでした', true));
      return;
    }
    if (action === 'set-auth') { $('#authBtn').click(); return; }
    if (action === 'set-browser') { say('ブラウザが開きます。ログインすると、自動でこのアプリに反映されます'); window.mv.browserLogin(); return; }
    if (action === 'fl-add') { add(String(p)); window.mv.menuData(menuData()); return; }
    if (action === 'fl-all') { add((Array.isArray(p) ? p : []).join(' '), true); window.mv.menuData(menuData()); return; }
    if (action === 'sug-hover') { sgIdx = Number(p); return; }
    if (action === 'sug-pick') { pickSug(Number(p)); addInput.focus(); return; }
    if (action === 'pp-save') {
      if (!items.length) { say('保存する枠がありません', true); return; }
      const n = savePreset(p); window.mv.menuData(menuData()); say(`「${n}」として保存しました`);
    } else if (action === 'pp-open') {
      const pr = presets[p]; if (!pr) return;
      if (evTrack) stopTrack();
      items = pr.items.filter(x => /^lv\d+$/.test(x)).slice(0, MAX); audioIds = [];
      items.forEach(id => { if (typeof volumes[id] !== 'number') volumes[id] = lastVol; });
      render(); say(`「${pr.name}」を開きました`);
    } else if (action === 'pp-del') {
      presets.splice(p, 1); persist(); window.mv.menuData(menuData());
    } else if (action === 'ev-key') {
      const k = keyOf(p); if (!k) { say('キーを読み取れませんでした', true); return; }
      if (!evKeys.includes(k)) evKeys = [k, ...evKeys].slice(0, 20);
      persist(); window.mv.menuData(menuData());
    } else if (action === 'ev-track') {
      evN = Number(p.n) || 4; startTrack(p.event);
    } else if (action === 'dlg-save') {
      if (!pendingEv) return; const n = savePreset(p); say(`「${n}」として保存しました`); const e = pendingEv; pendingEv = null; doTrack(e);
    } else if (action === 'dlg-no') {
      if (!pendingEv) return; const e = pendingEv; pendingEv = null; doTrack(e);
    } else if (action === 'dlg-cancel') { pendingEv = null; }
  });
  function renderChip() {
    $('#evChip').classList.toggle('show', !!evTrack);
    $('#evChipT').textContent = evTrack ? `🎁 ${evTrack.title} 上位${evTrack.n}` : '';
    evBtn.classList.toggle('on', !!evTrack);
  }
  function startTrack(e) {
    if (items.length) {
      pendingEv = e;
      setTimeout(() => openMenu('dlg', evBtn), 350); return;
    }
    doTrack(e);
  }
  let evAudioPending = false;   // 追跡を始めたあと、最初に枠が並んだときだけ、音声を出す
  function doTrack(e) {
    evGen++; evBusy = false; evAudioPending = true;
    items = []; audioIds = []; evLvs = []; ranks.clear(); focusId = '';
    layout = 'auto';   // ギフト表示は自動グリッド
    evTrack = { key: e.key, title: e.title, n: Number(evN) || 4 };
    evSig = null; render(); renderChip(); persist(); refreshTop(true); clearInterval(evTimer); evTimer = setInterval(() => refreshTop(false), 10000);
  }
  function stopTrack() {
    evGen++; evBusy = false;
    evTrack = null; clearInterval(evTimer); evSig = ''; ranks.clear(); evLvs = []; renderChip(); persist(); updateTags();
  }
  async function refreshTop(first) {
    if (!evTrack || evBusy) return;
    evBusy = true;
    const gen = evGen;
    let r; try { r = await window.mv.evTop(evTrack.key, evTrack.n); } catch { r = null; }
    if (gen !== evGen) return;   // 追跡を切り替えた後に返ってきた古い結果は捨てる
    evBusy = false;
    if (!evTrack) return;
    if (!r || !r.ok) { if (first) say('順位を取得できませんでした(イベントが終了した可能性があります)', true); return; }
    const live = r.top.filter(x => x.lv);
    // 順位の並び(放送中の人だけ)が変わったときだけ、枠を入れ替える
    const sig = live.map(x => x.lv).join(',');
    ranks.clear(); live.forEach(x => ranks.set(x.lv, { rank: x.rank, score: x.score, sm: x.sm }));
    if (sig !== evSig) {
      evSig = sig;
      const want = live.map(x => x.lv);
      const manual = items.filter(id => !evLvs.includes(id) && !want.includes(id));
      const next = [...want, ...manual].slice(0, MAX);
      next.forEach(id => { if (typeof volumes[id] !== 'number') volumes[id] = lastVol; });
      evLvs.filter(id => !want.includes(id)).forEach(id => { audioIds = audioIds.filter(x => x !== id); });
      // 設定「ギフトイベントで全枠の音声を出す」: 追跡で並んだ(新しく増えた)枠の音声をすべてONにする
      if (evAudioAll) { const fresh = want.filter(id => !evLvs.includes(id) && next.includes(id) && !audioIds.includes(id)); if (fresh.length) audioIds = [...audioIds, ...fresh]; }
      evLvs = want; items = next;
      // 設定「追加したときに音声を出す」がONなら、追跡で最初に並んだとき、1位の枠の音声をONにする
      if (evAudioPending && want.length) { evAudioPending = false; if (audioOnAdd && !audioIds.length && !evAudioAll) audioIds = [want[0]]; }
      render();
    } else updateTags();
    const off = r.top.filter(x => !x.lv).map(x => `${x.rank}位 ${x.name}`);
    if (first && off.length) say((live.length ? '' : '上位者で放送中の人がいません / ') + `放送なし: ${off.join('、')}`, !live.length);
  }
  evBtn.addEventListener('click', () => openMenu('ev', evBtn));
  $('#flBtn').addEventListener('click', () => openMenu('fl', $('#flBtn')));
  $('#ppBtn').addEventListener('click', () => openMenu('pp', $('#ppBtn')));
  $('#evStop').addEventListener('click', stopTrack);

  /* ---------- 起動時 ---------- */
  Promise.all([window.mv.load(), window.mv.auth()]).then(([s, a]) => {
    loggedIn = !!a;
    window.mv.authVia().then(v => { loginVia = loggedIn ? (v || '') : ''; renderAuth(); }).catch(() => {});
    if (s && Array.isArray(s.items)) {
      items = s.items.filter(x => /^lv\d+$/.test(x)).slice(0, MAX);
      layout = ['auto', 'main', 'row', 'col'].includes(s.layout) ? s.layout : 'auto';
      if (Array.isArray(s.audioIds)) audioIds = s.audioIds.filter(x => items.includes(x));
      else audioIds = items.includes(s.audioId) ? [s.audioId] : (items[0] ? [items[0]] : []);   // 旧形式の保存データ
      if (typeof s.playerOnly === 'boolean') playerOnly = s.playerOnly;
      if (typeof s.showCmt === 'boolean') showCmt = s.showCmt;
      if (typeof s.use184 === 'boolean') use184 = s.use184;
      if (typeof s.audioOnAdd === 'boolean') audioOnAdd = s.audioOnAdd;
      if (typeof s.evAudioAll === 'boolean') evAudioAll = s.evAudioAll;
      if (typeof s.singleOpen === 'boolean') singleOpen = s.singleOpen;
      if (typeof s.showSm === 'boolean') { showSm = s.showSm; document.body.classList.toggle('nosm', !showSm); }
      if (typeof s.seekOn === 'boolean') { seekOn = s.seekOn; window.mv.seek(seekOn); }
      if (typeof s.shotDir === 'string') shotDir = s.shotDir;
      if (typeof s.hideSrcName === 'boolean') hideSrcName = s.hideSrcName;
      if (typeof s.viewerSimple === 'boolean') viewerSimple = s.viewerSimple;
      window.mv.viewerOpt({ hideSrc: hideSrcName, simple: viewerSimple });
      if (typeof s.alwaysTop === 'boolean') { alwaysTop = s.alwaysTop; window.mv.alwaysTop(alwaysTop); }
      if (['system', 'light', 'dark', 'glassb', 'glassc', 'glassf'].includes(s.theme)) theme = s.theme;
      if (s.theme === 'glass') theme = 'glassb';
      if (s.volumes && typeof s.volumes === 'object') for (const [k, v] of Object.entries(s.volumes)) if (/^lv\d+$/.test(k) && Number.isFinite(Number(v))) volumes[k] = Math.min(1, Math.max(0, Number(v)));
      if (s.hideCmts && typeof s.hideCmts === 'object') for (const [k, v] of Object.entries(s.hideCmts)) if (/^lv\d+$/.test(k) && v === true) hideCmts[k] = true;
      if (Number.isFinite(Number(s.lastVol))) lastVol = Math.min(1, Math.max(0, Number(s.lastVol)));
      items.forEach(id => { if (typeof volumes[id] !== 'number') volumes[id] = lastVol; });
    }
    themeSel.value = theme; document.documentElement.dataset.theme = theme;
    poEl.checked = playerOnly; scEl.checked = showCmt; a184.checked = use184;
    if (s && Array.isArray(s.presets)) presets = s.presets.filter(p => p && typeof p.name === 'string' && Array.isArray(p.items)).map(p => ({ name: p.name.slice(0, 40), items: p.items.filter(x => /^lv\d+$/.test(x)).slice(0, MAX) })).slice(0, 30);
    if (s && Array.isArray(s.evKeys)) evKeys = s.evKeys.filter(k => /^[\w-]{1,80}$/.test(String(k))).slice(0, 20);
    if (s && s.evTrack && /^[\w-]{1,80}$/.test(String(s.evTrack.key))) {
      evTrack = { key: s.evTrack.key, title: String(s.evTrack.title || '').slice(0, 100), n: Math.min(12, Math.max(1, Number(s.evTrack.n) || 4)) };
      evN = evTrack.n; evTimer = setInterval(() => refreshTop(false), 10000);
    }
    render(); renderChip();
    if (evTrack) refreshTop(true);
  });
})();
</script>
</body>
</html>
