<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>コメビュ</title>
<style>
:root{
  --bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--text:#e8eaf0;--sub:#9aa3b2;--accent:#4da3ff;--danger:#ff6b6b;--ok:#5fd38d;
  --input:#0c0e12;--btn:#232834;--btnhv:#44507a;--onaccent:#06121f;--tilebg:#05070a;--stagebg:#000;--tagbg:#000a;
  --hl:#1d3a5c;--dragbg:#0b0e14;--dragon:#14263d;--chip:#161a22;--hover:#ffffff0a;--rowline:#ffffff08;
  --c0:#4da3ff;--c1:#ff8a5c;--c2:#5fd38d;--c3:#e0b341;--c4:#c78bff;--c5:#ff6fa8;--c6:#4fd1d9;--c7:#a3b86c;
  color-scheme:dark;
  --fs:14px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6fa;--panel:#ffffff;--line:#d3d9e3;--text:#1a1f2b;--sub:#5b6577;--accent:#1a73e8;--danger:#d93025;--ok:#188038;
    --input:#ffffff;--btn:#eef1f6;--btnhv:#9db4dc;--onaccent:#ffffff;--tilebg:#dfe4ec;--stagebg:#e6eaf1;--tagbg:#ffffffd9;
    --hl:#cfe0fb;--dragbg:#e3e8f0;--dragon:#cfe0fb;--chip:#f0f3f8;--hover:#0000000a;--rowline:#00000010;
    --c0:#1a73e8;--c1:#d9531e;--c2:#188038;--c3:#9a6b00;--c4:#8a3ffc;--c5:#c2185b;--c6:#00838f;--c7:#5d6f1f;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Noto Sans JP","Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;font-size:14px}
body{display:flex;flex-direction:column;overflow:hidden}
#bar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
button{font:inherit;font-size:12px;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--btnhv)}
input[type=text]{flex:1;min-width:90px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--input);color:var(--text);font:inherit;font-size:12px}
input[type=text]:focus{outline:2px solid var(--accent)}
.chk{display:flex;align-items:center;gap:4px;color:var(--sub);font-size:12px;cursor:pointer;white-space:nowrap}
#chips{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line);min-height:34px}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer;user-select:none;max-width:100%}
.chip i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lamp{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:50%;background:#2fbf5b;box-shadow:0 0 0 2px color-mix(in srgb,#2fbf5b 28%,transparent),0 0 7px #2fbf5b;vertical-align:baseline;position:relative;top:0}
#mode{display:inline-flex;align-items:center;color:var(--sub);font-size:12px;white-space:nowrap}
.chip.off{opacity:.4;text-decoration:line-through}
#list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 0}
.line{display:grid;grid-template-columns:3.6em 4.4em 10px 9.5em minmax(0,9em) 1fr;gap:0 8px;align-items:baseline;padding:4px 10px;font-size:var(--fs);line-height:1.45;border-bottom:1px solid var(--line)}
.line{background:var(--tint,transparent)}
.line:hover{background:var(--hover)}
.line.hide,.line.ng{display:none}
.line.sel{background:var(--hl);font-weight:700}
.s{justify-self:start;max-width:100%;box-sizing:border-box;font-size:.75em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1.5px solid currentColor;border-radius:7px;padding:0 7px;line-height:1.5;background:color-mix(in srgb,currentColor 12%,transparent)}
.no{color:var(--sub);font-size:.8em;text-align:right;font-variant-numeric:tabular-nums}
.t{color:var(--sub);font-size:.8em;font-variant-numeric:tabular-nums}
.d{width:9px;height:9px;border-radius:50%;align-self:center;cursor:pointer}
.n{font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--sub)}
.n.nick{color:var(--accent)}
.n:hover{text-decoration:underline}
.x{min-width:0;word-break:break-all;user-select:text;white-space:pre-wrap}

@media (max-width:680px){
  .line{grid-template-columns:auto auto 10px minmax(0,1fr) minmax(0,9em);gap:1px 8px;padding:5px 10px}
  .s{justify-self:end}
  .x{grid-column:1 / -1;grid-row:2}
  .no{text-align:left}
}
@media (max-width:420px){ .no{display:none} .line{grid-template-columns:auto 10px minmax(0,1fr) minmax(0,9em)} }
/* 設定「コメビュに放送者名を表示」をOFFにしたとき */
/* 設定「コメビュをコメントだけにする」をONにしたとき: コメントの文字以外は、すべて消す */
body.simple #bar,body.simple #chips,body.simple .no,body.simple .t,body.simple .d,body.simple .n,body.simple .s{display:none!important}
body.simple .line{display:block!important;padding:4px 12px!important}
body.nosrc .s{display:none}
body.nosrc .line{grid-template-columns:3.6em 4.4em 10px 9.5em 1fr}
@media (max-width:680px){ body.nosrc .line{grid-template-columns:auto auto 10px minmax(0,1fr)} }
@media (max-width:420px){ body.nosrc .line{grid-template-columns:auto 10px minmax(0,1fr)} }
#list{overflow-x:hidden}
#empty{color:var(--sub);text-align:center;padding:36px 16px;line-height:1.9}
.menu{position:fixed;z-index:50;min-width:15em;max-width:88vw;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px #0006;padding:6px;display:grid;gap:4px}
.menu .h{padding:3px 8px 5px;font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu button{text-align:left;border:0;border-radius:8px;background:var(--btn);padding:8px 11px;font-size:13px}
.menu button:hover{background:var(--btnhv);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px}
.sw i{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw i:hover{border-color:var(--text)}
.ov{position:fixed;inset:0;z-index:60;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column}
.box .bh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.box .bb{overflow:auto;padding:6px 0}
.box .hr{display:grid;grid-template-columns:5.6em 1fr;gap:8px;padding:4px 14px;font-size:13px;border-bottom:1px solid var(--rowline)}
.box .hr span:first-child{color:var(--sub);font-size:.85em}
.box .ngr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 14px;font-size:13px}
.box .note{padding:6px 14px;font-size:12px;color:var(--sub)}
#latest{position:absolute;right:14px;bottom:14px;display:none;background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:700;padding:5px 12px;border-radius:999px}
#wrap{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
/* ガラステーマ3種: B=Windows 11風(ダーク) / C=明るいフロスト / F=スモーク。Windows 11 では窓の背景もすりガラスになる */
/* B  Windows 11 風(Acrylic/Mica・ダーク) */
:root[data-theme="glassb"]{--bg:transparent;--panel:rgba(32,34,46,.55);--line:rgba(255,255,255,.12);--text:#f3f4f8;--sub:#aab0c4;--accent:#7fb2ff;--input:rgba(0,0,0,.28);
--btn:rgba(255,255,255,.08);--btnhv:#7fb2ff;--onaccent:#08142b;--tilebg:rgba(255,255,255,.04);--stagebg:transparent;--tagbg:rgba(0,0,0,.45);--hl:rgba(127,178,255,.3);color-scheme:dark}
:root[data-theme="glassb"] #bar,:root[data-theme="glassb"] .head,:root[data-theme="glassb"] .foot{backdrop-filter:blur(30px) saturate(1.6)}
:root[data-theme="glassb"] button,:root[data-theme="glassb"] select{border-color:rgba(255,255,255,.14)!important;border-radius:6px!important}
:root[data-theme="glassb"] .tile{border-color:rgba(255,255,255,.1);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
:root[data-theme="glassb"]:not(.acrylic){background:radial-gradient(700px 420px at 15% 15%,#5b3fd0 0,transparent 60%),radial-gradient(700px 500px at 90% 20%,#1e88e5 0,transparent 60%),radial-gradient(700px 400px at 50% 110%,#e0457b 0,transparent 60%),linear-gradient(160deg,#10142a,#1b2145)}
/* C  macOS風(明るいフロスト) */
:root[data-theme="glassc"]{--bg:transparent;--panel:rgba(255,255,255,.55);--line:rgba(0,0,0,.1);--text:#1c1f26;--sub:#5d6475;--accent:#0a84ff;--input:rgba(255,255,255,.7);
--btn:rgba(255,255,255,.75);--btnhv:#0a84ff;--onaccent:#fff;--tilebg:rgba(255,255,255,.35);--stagebg:transparent;--tagbg:rgba(255,255,255,.75);--hl:rgba(10,132,255,.2);color-scheme:light}
:root[data-theme="glassc"] #bar,:root[data-theme="glassc"] .head,:root[data-theme="glassc"] .foot{backdrop-filter:blur(28px) saturate(1.8)}
:root[data-theme="glassc"] button,:root[data-theme="glassc"] select{border-radius:8px!important;box-shadow:0 1px 2px rgba(0,0,0,.12)}
:root[data-theme="glassc"] .tile{border-radius:12px;border-color:rgba(255,255,255,.8);box-shadow:0 6px 20px rgba(60,70,100,.18)}
:root[data-theme="glassc"]:not(.acrylic){background:radial-gradient(700px 420px at 15% 10%,#ffd1a6 0,transparent 60%),radial-gradient(700px 500px at 90% 20%,#a6c8ff 0,transparent 60%),radial-gradient(700px 400px at 50% 110%,#c8f0d0 0,transparent 60%),linear-gradient(160deg,#e9edf6,#f6e9ef)}
/* F  スモークガラス(黒く落ち着いた半透明) */
:root[data-theme="glassf"]{--bg:transparent;--panel:rgba(8,8,12,.62);--line:rgba(255,255,255,.1);--text:#ececf2;--sub:#9a9cab;--accent:#8ab4ff;--input:rgba(255,255,255,.07);
--btn:rgba(255,255,255,.06);--btnhv:#8ab4ff;--onaccent:#071228;--tilebg:rgba(0,0,0,.25);--stagebg:transparent;--tagbg:rgba(0,0,0,.6);--hl:rgba(138,180,255,.25);color-scheme:dark}
:root[data-theme="glassf"] #bar,:root[data-theme="glassf"] .head,:root[data-theme="glassf"] .foot{backdrop-filter:blur(8px)}
:root[data-theme="glassf"] button,:root[data-theme="glassf"] select{border-color:rgba(255,255,255,.1)!important}
:root[data-theme="glassf"] .tile{border-color:rgba(255,255,255,.08)}
:root[data-theme="glassf"]:not(.acrylic){background:radial-gradient(700px 420px at 15% 15%,#5b3fd0 0,transparent 60%),radial-gradient(700px 500px at 90% 20%,#1e88e5 0,transparent 60%),radial-gradient(700px 400px at 50% 110%,#e0457b 0,transparent 60%),linear-gradient(160deg,#10142a,#1b2145)}

:root[data-theme^="glass"] #chips,:root[data-theme^="glass"] .chip{backdrop-filter:blur(8px)}
:root[data-theme="glassb"]{--chip:rgba(255,255,255,.1);--c0:#6db4ff}
:root[data-theme="glassf"]{--chip:rgba(255,255,255,.08)}
:root[data-theme="glassc"]{--chip:rgba(255,255,255,.75)}
:root[data-theme="glassb"] body,:root[data-theme="glassf"] body{color-scheme:dark}

/* 選択肢の一覧は、背景が透けないよう、はっきりした色にする */
:root[data-theme="glassb"] option{background:#232638;color:#f3f4f8}
:root[data-theme="glassf"] option{background:#14141b;color:#ececf2}
:root[data-theme="glassc"] option{background:#ffffff;color:#1c1f26}
</style>
</head>
<body>
<div id="bar">
  <input id="q" type="text" placeholder="コメントを検索" aria-label="コメントを検索">
  <button id="fm" type="button" title="文字を小さく">A−</button>
  <button id="fp" type="button" title="文字を大きく">A＋</button>
  <span id="mode" class="chk" title="コメントを受け取っています"></span>
  <label class="chk" id="topLab"><input id="top" type="checkbox">最前面</label>
  <button id="dockBtn" type="button" title="メインの窓の右側に合体します">合体</button>
  <button id="ngb" type="button" title="NGユーザー・NGワードの確認と解除">NG</button>
  <button id="clr" type="button">クリア</button>
</div>
<div id="chips" aria-label="表示する放送"></div>
<div id="wrap">
  <div id="list"><div id="empty">コメントを待っています…<br>メインの画面で放送を追加すると、全枠のコメントがここに集まります</div></div>
  <button id="latest" type="button">↓ 最新へ</button>
</div>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const list = $('#list'), chips = $('#chips'), latest = $('#latest');
  const MAXLINES = 1500;
  const colorOf = new Map(), names = new Map(), hidden = new Set();
  let openIds = null;   // いま開いている枠(メインから届く)
  let query = '';

  const color = id => { if (!colorOf.has(id)) colorOf.set(id, `var(--c${colorOf.size % 8})`); return colorOf.get(id); };
  const nameOf = id => names.get(id) || id;
  const hhmmss = t => { const d = new Date(t), p = n => String(n).padStart(2, '0'); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
  const atBottom = () => list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  // 自動スクロール: 上へスクロールするか、コメントをクリックすると完全に止まる。 「最新へ」を押すか、手で一番下まで戻すと再開する
  let paused = false, userAt = 0;
  const follow = () => !paused && atBottom();
  const showLatest = () => { latest.style.display = (paused || !atBottom()) ? 'block' : 'none'; };
  const pause = () => { paused = true; showLatest(); };
  const resume = () => { paused = false; list.scrollTop = list.scrollHeight; showLatest(); };
  const matches = (el) => !hidden.has(el.dataset.src) && (!query || el.dataset.text.includes(query));
  const applyFilter = el => el.classList.toggle('hide', !matches(el));

  function renderChips() {
    chips.textContent = '';
    for (const [id] of colorOf) {
      if (openIds && !openIds.has(id)) continue;   // 閉じた枠は、絞り込みの一覧に出さない(過去のコメントは残る)
      const c = document.createElement('div'); c.className = 'chip' + (hidden.has(id) ? ' off' : ''); c.title = id + '(クリックで表示/非表示)';
      const dot = document.createElement('i'); dot.style.background = color(id);
      const nm = document.createElement('span'); nm.textContent = nameOf(id);
      c.append(dot, nm);
      c.addEventListener('click', () => { hidden.has(id) ? hidden.delete(id) : hidden.add(id); renderChips(); refilter(); });
      chips.appendChild(c);
    }
  }
  function refilter() {
    const stick = follow();
    list.querySelectorAll('.line').forEach(applyFilter);
    if (stick) list.scrollTop = list.scrollHeight;
  }
  function refreshNames() {
    list.querySelectorAll('.line').forEach(l => { const s = l.querySelector('.s'); s.textContent = nameOf(l.dataset.src); s.title = s.textContent; });
  }

  const pad2 = n => String(n).padStart(2, '0');
  const clock = ms => { const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
  const hue = u => { let h = 0; for (let i = 0; i < u.length; i++) h = (h * 31 + u.charCodeAt(i)) >>> 0; return h % 360; };
  const store = [];                 // 受け取ったコメント(コメント履歴に使う)
  const seenKey = new Set();
  const ld = (k, d) => { try { const j = JSON.parse(localStorage.getItem(k) || 'null'); return j && typeof j === 'object' ? j : d; } catch (e) { return d; } };
  const sv = (k, o) => { try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} };
  let ng = Object.assign({ u: {}, w: [] }, ld('vw.ng', {}));
  if (!Array.isArray(ng.w)) ng.w = [];
  const ucol = ld('vw.col', {});    // ユーザーごとの色
  let selU = '';                    // 名前を押して選んだユーザー(同じ人のコメントを強調)
  const isNg = it => !!(it.u && ng.u[it.u]) || ng.w.some(w => w && it.text.toLowerCase().includes(w));
  const dispName = it => it.nm || (it.u && it.u[0] === 'h' ? '184(' + it.u.slice(1, 7) + ')' : it.u ? 'ID ' + it.u.slice(1) : '(不明)');
  const tintOf = c => `color-mix(in srgb, ${c} 26%, transparent)`;
  const userColor = u => ucol[u] || `hsl(${hue(u || 'x')},65%,55%)`;

  function makeRow(it) {
    const l = document.createElement('div'); l.className = 'line'; l.dataset.src = it.id; l.dataset.text = (it.nm + ' ' + it.text).toLowerCase(); l.dataset.u = it.u || '';
    const s = document.createElement('span'); s.className = 's'; s.style.color = color(it.id); s.textContent = nameOf(it.id); s.title = nameOf(it.id);
    const no = document.createElement('span'); no.className = 'no'; no.textContent = it.no || '';
    const t = document.createElement('span'); t.className = 't'; t.textContent = clock(it.t);
    const d = document.createElement('span'); d.className = 'd'; d.style.background = userColor(it.u);
    const n = document.createElement('span'); n.className = 'n' + (it.nm ? ' nick' : ''); n.textContent = dispName(it); n.title = (it.u && it.u[0] === 'h' ? '匿名(184)の投稿者 ID ' + it.u.slice(1) : n.textContent) + '(押すとメニュー)';
    if (ucol[it.u]) { n.style.color = ucol[it.u]; l.style.setProperty('--tint', tintOf(ucol[it.u])); }
    const x = document.createElement('span'); x.className = 'x'; x.textContent = it.text;
    l.append(no, t, d, n, s, x);
    l._it = it;
    if (isNg(it)) l.classList.add('ng');
    if (selU && it.u === selU) l.classList.add('sel');
    applyFilter(l);
    return l;
  }
  function add(items) {
    if (!items.length) return;
    const stick = follow();
    const e = $('#empty'); if (e) e.remove();
    const frag = document.createDocumentFragment();
    let newSrc = false;
    for (const it of items) {
      const key = it.no ? it.id + ':' + it.no : '';
      if (key) { if (seenKey.has(key)) continue; seenKey.add(key); }
      if (!colorOf.has(it.id)) newSrc = true;
      store.push(it); frag.appendChild(makeRow(it));
    }
    if (store.length > 6000) store.splice(0, store.length - 6000);
    if (seenKey.size > 12000) { const k = [...seenKey].slice(-6000); seenKey.clear(); k.forEach(x => seenKey.add(x)); }
    list.appendChild(frag);
    while (list.childElementCount > MAXLINES) list.firstElementChild.remove();
    if (newSrc) renderChips();
    if (stick) list.scrollTop = list.scrollHeight; else showLatest();
  }
  const rows = () => list.querySelectorAll('.line');
  function restyle() { rows().forEach(l => { const it = l._it; l.classList.toggle('ng', isNg(it)); l.classList.toggle('sel', !!selU && it.u === selU); const c = ucol[it.u]; l.querySelector('.d').style.background = userColor(it.u); l.querySelector('.n').style.color = c || ''; if (c) l.style.setProperty('--tint', tintOf(c)); else l.style.removeProperty('--tint'); }); }

  // ---- 名前を押したときのメニュー ----
  let menu = null;
  const closeMenu = () => { if (menu) menu.remove(); menu = null; };
  const place = (m, r) => { document.body.appendChild(m); const w = m.offsetWidth, h = m.offsetHeight; m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px'; m.style.top = (r.bottom + h + 8 > window.innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px'; };
  function openMenu(it, anchor) {
    closeMenu();
    const m = document.createElement('div'); m.className = 'menu'; menu = m;
    const h = document.createElement('div'); h.className = 'h'; h.textContent = it.u && it.u[0] === 'h' ? dispName(it) + '  ID ' + it.u.slice(1) : dispName(it); m.appendChild(h);
    const item = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.addEventListener('click', ev => { ev.stopPropagation(); fn(); }); m.appendChild(b); };
    item('コメントをコピー', () => { window.vw.copy(it.text); closeMenu(); });
    item('色をつける…', () => colorMenu(it, anchor));
    const cnt = store.filter(s => s.u === it.u).length;
    item(`コメント履歴(${cnt}件)`, () => { closeMenu(); history(it); });
    if (ng.u[it.u]) item('このユーザーのNGを解除', () => { delete ng.u[it.u]; sv('vw.ng', ng); restyle(); closeMenu(); });
    else item('このユーザーをNGにする', () => { ng.u[it.u] = dispName(it); sv('vw.ng', ng); restyle(); closeMenu(); });
    const raw = it.text.trim();
    if (raw && raw.length <= 40 && !ng.w.includes(raw.toLowerCase())) item('このコメントの文言をNGワードにする', () => { ng.w.push(raw.toLowerCase()); sv('vw.ng', ng); restyle(); closeMenu(); });
    place(m, anchor.getBoundingClientRect());
  }
  const PALETTE = ['#ff5c5c', '#ff9a3c', '#e8c340', '#5fd38d', '#4fd1d9', '#4da3ff', '#a78bfa', '#ff6fa8'];
  function colorMenu(it, anchor) {
    closeMenu();
    const m = document.createElement('div'); m.className = 'menu'; menu = m;
    const h = document.createElement('div'); h.className = 'h'; h.textContent = dispName(it) + ' の色(行に色がつきます)'; m.appendChild(h);
    const sw = document.createElement('div'); sw.className = 'sw';
    PALETTE.forEach(c => { const i = document.createElement('i'); i.style.background = c; i.addEventListener('click', ev => { ev.stopPropagation(); ucol[it.u] = c; sv('vw.col', ucol); restyle(); closeMenu(); }); sw.appendChild(i); });
    m.appendChild(sw);
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '色を戻す'; b.addEventListener('click', ev => { ev.stopPropagation(); delete ucol[it.u]; sv('vw.col', ucol); restyle(); closeMenu(); }); m.appendChild(b);
    place(m, anchor.getBoundingClientRect());
  }
  function overlay(title) {
    const ov = document.createElement('div'); ov.className = 'ov';
    const box = document.createElement('div'); box.className = 'box';
    const hd = document.createElement('div'); hd.className = 'bh'; const tt = document.createElement('span'); tt.textContent = title;
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '✕'; x.addEventListener('click', () => ov.remove()); hd.append(tt, x);
    const bb = document.createElement('div'); bb.className = 'bb'; box.append(hd, bb); ov.appendChild(box);
    ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
    return bb;
  }
  function history(it) {
    const list2 = store.filter(s => s.u === it.u);
    const bb = overlay(`${dispName(it)} のコメント(${list2.length}件)`);
    const n = document.createElement('div'); n.className = 'note'; n.textContent = 'ここで受け取ったコメントの中から表示しています'; bb.appendChild(n);
    list2.forEach(s => {
      const r = document.createElement('div'); r.className = 'hr';
      const a = document.createElement('span'); a.textContent = clock(s.t) + ' ' + nameOf(s.id).slice(0, 6);
      const b = document.createElement('span'); b.textContent = s.text; r.append(a, b); bb.appendChild(r);
    });
    bb.scrollTop = bb.scrollHeight;
  }
  function ngPanel() {
    const bb = overlay('NGの確認・解除');
    const draw = () => {
      bb.textContent = '';
      const us = Object.keys(ng.u), ws = ng.w;
      if (!us.length && !ws.length) { const n = document.createElement('div'); n.className = 'note'; n.textContent = 'NGはありません'; bb.appendChild(n); return; }
      const row = (label, fn) => { const r = document.createElement('div'); r.className = 'ngr'; const s = document.createElement('span'); s.textContent = label; const b = document.createElement('button'); b.type = 'button'; b.textContent = '解除'; b.addEventListener('click', () => { fn(); sv('vw.ng', ng); restyle(); draw(); }); r.append(s, b); bb.appendChild(r); };
      us.forEach(u => row('ユーザー: ' + (ng.u[u] || u), () => { delete ng.u[u]; }));
      ws.forEach((w, i) => row('ワード: ' + w, () => { ng.w.splice(i, 1); }));
    };
    draw();
  }
  $('#ngb').addEventListener('click', ngPanel);
  list.addEventListener('click', e => {
    const t = e.target; if (!t.closest) return;
    const tg = t.closest('.n, .d'), line = t.closest('.line');
    if (!tg || !line || !line._it || !line._it.u) { if (line && selU) { selU = ''; restyle(); } return; }
    e.stopPropagation();
    selU = line._it.u; restyle();
    openMenu(line._it, tg);
  });
  // シンプル表示(コメントだけ)のときは、コメントの行を右クリックして、同じメニュー(コピー・色・履歴・NG)を出す
  list.addEventListener('contextmenu', e => {
    if (!document.body.classList.contains('simple')) return;
    const line = e.target.closest && e.target.closest('.line'); if (!line || !line._it) return;
    e.preventDefault(); e.stopPropagation(); closeMenu();
    selU = line._it.u || ''; restyle();
    const a = document.createElement('span'); a.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:0;height:0`; document.body.appendChild(a);
    openMenu(line._it, a); a.remove();
  });
  list.addEventListener('dblclick', e => {
    const line = e.target.closest && e.target.closest('.line'); if (!line || !line._it || !line._it.u) return;
    e.preventDefault(); e.stopPropagation(); closeMenu();
    const a = document.createElement('span'); a.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:0;height:0`; document.body.appendChild(a);
    colorMenu(line._it, a); a.remove();
    setTimeout(() => { const s = window.getSelection && window.getSelection(); if (s) s.removeAllRanges(); }, 0);
  });
  document.addEventListener('click', closeMenu);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); if (selU) { selU = ''; restyle(); } } });
  // メニューは、自分でスクロールしたときだけ閉じる(新しいコメントによる自動スクロールでは閉じない)
  list.addEventListener('wheel', e => { userAt = Date.now(); closeMenu(); if (e.deltaY < 0) pause(); }, { passive: true });
  list.addEventListener('pointerdown', () => { userAt = Date.now(); pause(); });
  list.addEventListener('keydown', () => { userAt = Date.now(); });
  list.addEventListener('scroll', () => {
    if (paused && Date.now() - userAt < 800 && atBottom()) paused = false;   // 手で一番下まで戻したら再開
    showLatest();
  });
  latest.addEventListener('click', resume);
  $('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); refilter(); });
  $('#clr').addEventListener('click', () => { list.textContent = ''; store.length = 0; seenKey.clear(); window.vw.clear(); });
  $('#top').addEventListener('change', e => window.vw.onTop(e.target.checked));
  let fs = 14;
  try { fs = Number(localStorage.getItem('vw.fs')) || 14; } catch (e) {}
  const setFs = v => { fs = Math.max(10, Math.min(30, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); try { localStorage.setItem('vw.fs', fs); } catch (e) {} };
  setFs(fs);
  $('#fm').addEventListener('click', () => setFs(fs - 1));
  $('#fp').addEventListener('click', () => setFs(fs + 1));

  window.vw.onSources(src => {
    (src || []).forEach(s => { names.set(s.id, s.name); color(s.id); });
    openIds = new Set((src || []).map(s => s.id));
    let changed = false; for (const id of [...hidden]) if (!openIds.has(id)) { hidden.delete(id); changed = true; }
    renderChips(); refreshNames(); if (changed) refilter();
  });
  const showMode = m => {
    const vals = Object.values(m || {}), el = $('#mode');
    el.textContent = ''; el.classList.toggle('on', vals.length > 0);
    if (!vals.length) return;
    const lamp = document.createElement('i'); lamp.className = 'lamp';
    el.append(lamp, document.createTextNode('接続中'));
  };
  window.vw.onMode(showMode);
  window.vw.onOpt(o => { document.body.classList.toggle('nosrc', !!(o && o.hideSrc)); document.body.classList.toggle('simple', !!(o && o.simple)); });
  window.vw.onComments(items => add(items));
  const setTheme = (t, ok) => { document.documentElement.dataset.theme = t || ''; document.documentElement.classList.toggle('acrylic', !!ok); };
  window.vw.onTheme(setTheme);
  window.vw.init().then(({ backlog, sources, modes, opt, theme, acrylic }) => {
    setTheme(theme, acrylic);
    showMode(modes);
    document.body.classList.toggle('nosrc', !!(opt && opt.hideSrc)); document.body.classList.toggle('simple', !!(opt && opt.simple));
    (sources || []).forEach(s => { names.set(s.id, s.name); color(s.id); });
    openIds = new Set((sources || []).map(s => s.id));
    renderChips(); add(backlog || []); list.scrollTop = list.scrollHeight; showLatest();
  });
})();
  // 合体(メインの窓の右側に入る)/ 切り離し
  (() => {
    const b = document.getElementById('dockBtn'), lab = document.getElementById('topLab');
    let docked = false;
    const apply = d => { docked = d; b.textContent = d ? '切り離す' : '合体'; b.title = d ? '別の窓に切り離します' : 'メインの窓の右側に合体します'; lab.style.display = d ? 'none' : ''; };
    b.addEventListener('click', () => { if (docked) window.vw.undock(); else window.vw.dock(); });
    window.vw.onDocked(apply); apply(false);
  })();
</script>
</body>
</html>
